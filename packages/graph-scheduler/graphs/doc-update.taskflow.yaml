name: doc-update
# Graph-level ambient context — glossary, domain index, and the vocabulary
# skills every document-maintenance phase consumes; declared once. CONTEXT.md
# also satisfies the atom-scope-interview / atom-doc-maintenance contract
# coverage statically.
context:
  - ./CONTEXT.md
  - docs/domains.md
  - skill:codebase-design
  - skill:clean-ddd-hexagonal
  - skill:caveman
  - skill:domain-modeling
phases:
  # Trigger — classify the document-maintenance trigger (event driven).
  - id: doc-trigger
    type: main
    dependsOn: []
    skill: atom-scope-interview
    task: |
      Classify the document-maintenance trigger per atom-scope-interview
      (trigger-first — event driven, no interview-driven scope collection).

      From upstream outputs when composed (doc_update_files, change name,
      affected domains); from the event when orchestrated after a spec
      archive (archive succeeded → spec-archive; skill assets changed →
      skill-change; domain table mutated → domain-change); no event →
      proactive.

      Output contract: trigger (spec-archive | domain-change | skill-change |
      proactive), affected_classes, scope_hints.

  # Maintain — run the maintenance pipeline per atom-doc-maintenance.
  - id: doc-maintain
    type: main
    dependsOn: [doc-trigger]
    skill: atom-doc-maintenance
    task: |
      Execute document maintenance per atom-doc-maintenance. maintain() per
      trigger + scope: classify, enumerate affected classes per taxonomy,
      apply per-class rules, run consistency gate. Do NOT edit contract
      documents (openspec/specs/) directly — flag for the delta flow.

      Output contract: changes (document, action, reason), validation
      (gate results per class), updated (paths).

  # Review — document changes reviewed against the Format Reference.
  - id: doc-review
    type: main
    dependsOn: [doc-maintain]
    skill: code-review
    agent: [reviewer, explore, task, general]
    channels:
      - node:doc-trigger
    task: |
      Review document changes per code-review (use ## Agent hints for axis
      sub-agents). Standards: atom-doc-maintenance Format Reference (metadata
      block, heading hierarchy, link validity, document types, language).
      Spec: doc-trigger output — maintenance matches trigger scope.

      Output contract: report (machine-parseable YAML, overall:
      pass | fail).

  # Accept — decision confirmation.
  - id: doc-accept
    type: approval
    dependsOn: [doc-review]
    task: |
      Accept the document maintenance?

      Decision: accept when the documents pass review; revise (re-run
      doc-maintain with feedback) or re-classify the trigger otherwise.
