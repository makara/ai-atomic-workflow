name: doc-update
phases:
  - id: doc-scope
    type: main
    dependsOn: []
    skill: atom-scope-interview
    channels:
      - ./CONTEXT.md
    task: |
      Execute scope interview per skill://atom-scope-interview (load atom-kernel).
      Flow context: prefer upstream plan-parse doc_update_files (injected when orchestrated); else interview (skill Step 1).

      Topics: target document paths; change type (new document / in-place edit / restructure / delete); change scope (full rewrite / section update / metadata update); dependencies (docs or skills referencing these documents); save location.
      Auto-approve mode (standard topic — ask AFTER scope, NEVER auto-approved):
      Manual (recommended, default) — every approval presents a decision card.
      Auto — every approval in this run (entry confirmations excluded — they are
      interviews, never auto) executes its recommended routing action (routingActions[0]).
      Echo rule: scan current-run completed node outputs first — an existing
      auto_approve field (nested composition) is inherited WITHOUT asking.

      Output: confirmed scope (target files, change type, expected changes), impact analysis, scope_complete: true, save_locations, auto_approve.

  - id: doc-write
    type: main
    dependsOn: [doc-scope]
    skill: atom-doc-writer
    task: |
      Execute document update per confirmed plan.

      Load atom-kernel (injected) for interview() behavior contract.
      Read doc-scope output (injected).

      Execute interview({ goal: "write document updates per confirmed plan", research: true, context }) in solve mode:

      confirm(goal): Confirm write scope with user — verify change plan is still accurate.

      research: Read target document files. Load any referenced style guides or format rules. Verify save locations.

      think: Draft complete document content — updated text, preserved structure, updated cross-references.

      interview(details): Present content decisions one at a time — key content changes, reference updates, formatting. User rejects → return to think.

      Output: When all confirmed, write document files to save_locations. Write output paths + summary (main agent collects).
    channels:
      - skill:atom-doc-spec
  - id: doc-review
    type: main
    dependsOn: [doc-write]
    skill: code-review
    agent: [reviewer, task]
    task: |
      Review document changes per code-review (use ## Agent hints for axis sub-agents).

      Artifact: document paths from doc-write output (injected).
      Standards: General Markdown/documentation conventions — structure, formatting, link validity, language consistency.
      Spec: doc-scope output (injected) — check doc matches confirmed change plan.

      Output machine-parseable YAML with overall: pass | fail. Write report (main agent collects).
    channels:
      - node:doc-scope

  - id: doc-gate
    type: gate
    dependsOn: [doc-review]
    eval:
      - when: 'doc-review output shows overall: fail AND retryAttempt < 2'
        action: retry
        target: doc-write
        note: 'auto: review found blocking issues — fix and re-review'

  - id: doc-accept
    type: approval
    dependsOn: [doc-gate]
    routing:
      actions:
        - action: continue
          label: 'Accept document'
          description: 'Document is ready — proceed'
        - action: retry
          target: doc-write
          label: 'Revise document'
          description: 'Document needs changes — re-run doc-write with review feedback'
        - action: jump
          target: doc-scope
          label: 'Revise plan'
          description: 'Fundamental plan issues — revise change plan'
