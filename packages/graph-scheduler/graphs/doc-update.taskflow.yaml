name: doc-update
phases:
  - id: doc-trigger
    type: main
    dependsOn: []
    skill: atom-scope-interview
    channels:
      - ./CONTEXT.md
    task: |
      Classify the document-maintenance trigger (trigger-first — event driven, no
      interview-driven scope collection).

      Flow context: prefer upstream plan-parse doc_update_files (injected when
      orchestrated via skill-change-workflow); else read upstream outputs for the
      triggering event. When orchestrated after a spec archive (openspec-family
      graphs), classify from the event: archive succeeded → spec-archive; skill
      assets changed → skill-change; domain table mutated → domain-change. Direct
      invocation with no event → proactive.

      Output: trigger (spec-archive | domain-change | skill-change | proactive),
      affected_classes (index | derived-view | normative | contract), scope_hints
      (change name, affected domains — from upstream when present).

  - id: doc-maintain
    type: main
    dependsOn: [doc-trigger]
    skill: atom-doc-maintenance
    task: |
      Execute document maintenance per atom-doc-maintenance.

      Read doc-trigger output (injected). Run the maintenance pipeline:

      maintain({ trigger, scope }) — classify trigger, enumerate affected document
      classes per the taxonomy, apply per-class rules (index evolution four-step /
      derived-view source→transform→verify / normative targeted edits / contract
      delta flow), then run the consistency gate (mapping, links, counts, derived).

      Write document updates per class rules. Do NOT edit contract documents
      (openspec/specs/) directly — flag them for the delta flow instead.

      Output (main agent collects): changes (document, action, reason), validation
      (gate results per class), updated (paths).
    channels:
      - node:doc-trigger
      - ./CONTEXT.md
      - docs/domains.md
      - skill:codebase-design
      - skill:clean-ddd-hexagonal
      - skill:caveman
      - skill:domain-modeling
  - id: doc-review
    type: main
    dependsOn: [doc-maintain]
    skill: code-review
    agent: [reviewer, explore, task, general]
    task: |
      Review document changes per code-review (use ## Agent hints for axis sub-agents).

      Artifact: document paths + validation from doc-maintain output (injected).
      Standards: atom-doc-maintenance Format Reference — metadata block, heading
      hierarchy, link validity, code blocks, document types; language consistency.
      Spec: doc-trigger output (injected) — check maintenance matches trigger scope.

      Output machine-parseable YAML with overall: pass | fail. Write report (main
      agent collects).
    channels:
      - node:doc-trigger
      - node:doc-maintain

  # Accept — decision confirmation (route-first: no written actions).
  # Recommendation follows the review verdict; revise/revise-trigger are AI-generated
  # dynamic options, not written.
  - id: doc-accept
    type: approval
    dependsOn: [doc-review]
    channels:
      - node:doc-review
    task: |
      Accept the document maintenance?

      doc-review reported the maintenance verdict. Recommendation follows the review
      verdict: accept when the document passes; otherwise revise (re-run doc-maintain
      with review feedback) or revise the trigger (re-classify at doc-trigger).
