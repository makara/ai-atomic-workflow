name: openspec-engineer
description: 'OpenSpec detailed implementation — spec synthesis, tickets, tdd implementation + review loop, lifecycle closure (archive + ADR fold + index).'
$schema: ../schemas/workflow.schema.json
version: 1.0.0
flow:
  - 'to-spec --> to-tickets'
  - 'to-tickets --> implement'
  - 'implement --> implement-review'
  - 'implement-review -->|fail| implement'
  - 'implement-review -->|pass| openspec-archive'
inventory:
  - id: to-spec
    type: main
    goal: Executes to-spec to synthesize the delta spec from the ADR decision and change context
    constraints:
      - never asks the change name — resolves from args or the active list
      - synthesizes only — never implements
  - id: to-tickets
    type: main
    goal: Executes to-tickets to split the spec into tracer-bullet tickets
    constraints:
      - splits only — never implements slices
  - id: implement
    type: main
    goal: Runs implement to deliver the ticket slices test-first THEN verifies the suite
    constraints:
      - test-first — never ships without verification
      - 're-entry: the flow self-edge implement-review -->|fail| implement re-runs the slice work (inline loop — retryCount bound + constraint prose)'
  - id: implement-review
    type: main
    goal: Runs code-review over the implementation THEN reports findings and the review condition (pass | fail)
    constraints:
      - reports findings — never fixes inline
      - review condition = flow-defined vocabulary (fail → flow self-edge re-entry; pass → drain) — never a next-node choice
  - id: openspec-archive
    type: main
    goal: Executes atom-doc-lifecycle to close the workflow and archive the change
    constraints:
      - closes the workflow — never reopens settled records
constraints:
  - "loop bound: the flow self-edge re-entry (implement-review -->|fail| implement) is bounded by the review condition 'pass' or the retry bound (implement-review retryCount, never zeroed); past the bound the review drains to openspec-archive"
  - 'review condition vocabulary: pass | fail — flow-defined, matched mechanically (zero machine validation axis; governance = graph-maintain flow audit + user maintenance)'
phases:
  - id: to-spec
    type: main
    skill: to-spec
    dependsOn: []
    operations: [read, write, run]
    task: |
      Synthesize the spec from the recorded ADR decision + change context per
      to-spec skill. No interview.
      Change name resolution — per the single source
      (task-templates/contracts.ts CHANGE_NAME_RESOLUTION_RULE); never
      re-encode the rule body here.
      Sketch seams (prefer existing, highest); select the recommended seam
      automatically — no confirmation.
      Write spec per to-spec template; publish to tracker with ready-for-agent
      label (none configured → docs/specs/).

      Output contract: spec_path, spec_status (published | blocked),
      seam_summary, change_name, adr_path.

  - id: to-tickets
    type: main
    skill: to-tickets
    dependsOn: [to-spec]
    operations: [read, write, run]
    task: |
      Break the spec into tracer-bullet tickets per to-tickets skill.
      Draft vertical slices with blocking edges; publish the breakdown
      automatically — no confirmation; in dependency order (local files
      when no tracker).

      Output contract: ticket_count, ticket_paths, change_name (echo).

  - id: implement
    type: main
    skill: implement
    dependsOn: [to-tickets]
    operations: [read, write, run, verify]
    channels:
      - node:implement-review
    task: |
      Execute implement graph mode per implement skill. Read to-spec
      output — seams come from seam_summary (selected automatically — no
      confirmation); tdd red-green slices in frontier
      order, regular
      typecheck + single-file tests, full suite at the end. Re-run rounds:
      fix every implement-review finding FIRST, then continue.

      Main-spec single writer: never edit openspec/specs/** main spec
      files during implementation; openspec archive is the sole
      spec-sync channel.

      Spec standards per affected domain — per atom-skill-spec §Domain Spec
      Standards Mapping.

      Output contract: diff_summary, changed_files, progress_note,
      verification_path (the change's verification document path — derived
      from change_name, e.g. openspec/changes/<change>/verification.md).

  - id: implement-review
    type: main
    skill: code-review
    agent: [reviewer, explore, task, general]
    dependsOn: [implement]
    operations: [locate, read, review]
    channels:
      - node:implement
    task: |
      Dual-axis review of the implementation per code-review (use ## Agent
      hints for axis sub-agents). Artifacts: diff (implement), recorded ADR —
      implementation must honor the decision. Spec: ticket acceptance
      criteria met; ADR honored.

      Spec standards per affected domain — per atom-skill-spec §Domain Spec
      Standards Mapping + repo coding standards.

      Output contract: report (structured YAML, overall: pass | fail),
      review_condition (fail | pass) — 'fail' when the review reports
      blocking findings within the retry bound (the flow self-edge
      re-enters implement); 'pass' otherwise (drain to openspec-archive).

  - id: openspec-archive
    type: main
    dependsOn: [implement-review]
    skill: atom-doc-lifecycle
    operations: [read, run, archive]
    channels:
      - node:to-spec
      - node:implement-review
    task: |
      Execute atom-doc-lifecycle close(): reverse-validate task completion
      against code evidence → archive → fold ADRs (adr_created: to-spec
      adr_path present → true; supersedes from the change's ADR metadata) →
      rebuild index → lifecycle validation. Change name: to-spec output
      change_name (echo). Verification document: node:implement-review
      verification_path field — tasks consume fields, never file globs.

      Output contract: archive_status (success | failed | blocked),
      change_name, adr_changes, index_rebuilt, validation, message.
