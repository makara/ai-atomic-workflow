name: graph-generate
description: 'Graph production maker journey — scope interview, graph design + accept, implement + review as an inline flow loop.'
$schema: ../schemas/workflow.schema.json
version: 1.0.0
flow:
  - 'startup --> entry'
  - 'entry --> spec'
  - 'spec --> spec-accept'
  - 'spec-accept --> implement'
  - 'implement --> review'
  - 'review -->|fail| implement'
  - 'review -->|pass| __handoff'
inventory:
  - id: startup
    type: main
    goal: Runs the startup template — constraints session load + serena activation + jcodemunch indexing (full startup — designs against existing graph conventions)
    constraints:
      - graph entry — dependsOn empty; entry depends on it
      - no user questions — self-decide startup steps
  - id: entry
    type: main
    goal: Executes atom-scope-interview to confirm the graph name, topology scope and save location
    constraints:
      - confirms only — never decides name, scope or save location
  - id: spec
    type: main
    goal: Executes atom-graph-design to design the topology THEN draft the inventory
    constraints:
      - designs only — never writes the graph file
  - id: spec-accept
    type: main
    goal: Confirms the graph design — accept when complete, rework otherwise
    constraints:
      - confirms only — never edits the design
  - id: implement
    type: main
    goal: Executes atom-graph-writer to generate the YAML with inventory and registry entry
    constraints:
      - writes the two-path bundle only — never co-produces skills
      - creation only — never edits existing graphs
  - id: review
    type: main
    goal: Runs code-review over the produced graph THEN reports the round condition (overall pass | fail — fail routes the flow self-edge re-entry)
    constraints:
      - reports findings — never fixes inline
constraints:
  - "loop bound: the flow self-edge re-entry (review -->|fail| implement) is bounded by the review condition 'pass' or the retry bound (2 rounds — retryCount tracks re-entries, never zeroed); past the bound the review drains"
  - 'round condition vocabulary: fail | pass — flow-defined, matched mechanically (zero machine validation axis; governance = graph-maintain flow audit + user maintenance)'
context:
  - skill:atom-graph-spec
phases:
  - id: startup
    type: main
    dependsOn: []
    template: startup
  - id: entry
    type: main
    dependsOn: [startup]
    skill: atom-scope-interview
    operations: []
    task: |
      Execute scope interview per atom-scope-interview (maker journey —
      kind=graph, operation=create; no kind switch, no skill co-production).

      Topics: graph name, topology scope (purpose, phases, skill
      dependencies), save location (default .graph-scheduler/graphs/).

      Behavior: confirm=mandatory; output path=user_owned;
      dual-name check=graph_name; context=optional.

      Output contract: graph_name, scope, save_location, scope_complete.

  - id: spec
    type: main
    dependsOn: [entry]
    skill: atom-graph-design
    operations: [read]
    task: |
      Execute atom-graph-design graph mode per atom-graph-design skill —
      entry scope is the design input; research → think → interview
      confirmation rounds (participation: mandatory), present design
      decisions one at a time.

      Confirm run-ending semantics per atom-graph-spec §Run Completion —
      consult, do not restate; propose no end phase and no `end` routing
      action.

      Output contract: design, graph_name (echo), save_location (echo),
      scope_complete (echo).

  - id: spec-accept
    type: main
    dependsOn: [spec]
    operations: []
    channels:
      - node:spec
    task: |
      Accept the graph design? (inline interview — human confirms at this
      boundary; branch choice via IF/ELSE.)

      Decision: accept when the design is complete per atom-graph-spec;
      revise otherwise — iterate the design in-conversation (present the
      revised decisions) before the implement phase dispatches; stop the
      journey mid-way — direct end.
      direct end: end the round.

  - id: implement
    type: main
    dependsOn: [spec-accept]
    skill: atom-graph-writer
    operations: [read, write, run, verify]
    channels:
      - node:spec
      - node:entry
      - node:review
    task: |
      Execute atom-graph-writer graph mode per atom-graph-writer skill —
      produce the graph artifact per the confirmed design + atom-graph-spec.

      Two-path bundle (project convention, writer skill cannot know it):
      graph file at .graph-scheduler/graphs/<name>.yaml (default
      save_location) with the $schema + version self-description header,
      registry entry in .graph-scheduler/graphs/registry.json.

      Load-probe validation: graph_start the produced graph → expect a node
      return (problems field carries load-time machine warnings, if any) → then graph_force_end the probe run.
      Report the probe result; deviations from design SHALL be reported, not
      negotiated.

      Output contract: artifact_path, registry_path, validation
      (passed | failed + details), graph_name (echo), summary.

  - id: review
    type: main
    dependsOn: [implement]
    skill: code-review
    operations: [locate, read, review]
    agent: [reviewer, explore, task, general]
    channels:
      - node:implement
    task: |
      Review the produced graph per code-review (use ## Agent hints for
      axis sub-agents; forward the injected ## Reference blocks — axis
      agents SHALL NOT re-discover atom-graph-spec). Standards:
      atom-graph-spec (graph definitions) + repo-documented coding
      standards. Spec: artifact matches the confirmed design.

      Round condition: report overall (pass | fail) — the flow-defined
      round condition: 'fail' → the flow self-edge re-enters implement
      (re-runs the implement+review round with the review findings);
      'pass' → drain. The retry bound (2 rounds — retryCount, never
      zeroed) caps re-entries; past the bound the review drains (report
      pass) so the run continues.

      Ownership obligation (on 'pass'): SHALL state that the produced
      graph is user-maintained from this point (FL3 ownership split — AI
      MAY have created it; once created, only the user maintains it;
      changes go through graph-maintain).

      Output contract: report (machine-parseable YAML, overall:
      pass | fail).
