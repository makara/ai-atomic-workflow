name: graph-generate
$schema: ../schemas/workflow.schema.json
version: 1.0.0
# Node overview table (atom inventory). Bounded compound goals:
# connectors AND/THEN/IF-ELSE/OR — structural keywords ALL-CAPS (AND/OR/IF/
# THEN/ELSE), prose and/or lowercase, ≤ 5 steps, gates ≤ 3 AND/OR operands,
# conditional paths ≤ 3. Entry shape { id, type, goal, constraints? } — goal
# states the atom's intent; mechanism lives in the goal (flow entries state
# "expands <use> subgraph"). constraints: one-sentence prose rules — general
# boundaries + explicit non-goals, ≤ 5 per atom, never machine-validated.
# User-maintained. Maker self-demonstration.
inventory:
  - id: entry
    type: main
    goal: Executes atom-scope-interview to confirm the graph name, topology scope and save location
    constraints:
      - confirms only — never decides name, scope or save location
  - id: spec
    type: main
    goal: Executes atom-graph-design to design the topology THEN draft the inventory
    constraints:
      - designs only — never writes the graph file
  - id: spec-accept
    type: approval
    goal: Accept the graph design OR route rework
    constraints:
      - routes only — never edits the design
  - id: implement
    type: main
    goal: Executes atom-graph-writer to generate the YAML with inventory, registry entry and attached doc
    constraints:
      - writes the three-path bundle only — never co-produces skills
      - creation only — never edits existing graphs
  - id: review
    type: main
    goal: Runs code-review over the produced graph THEN reports findings
    constraints:
      - reports findings — never fixes inline
  - id: gate
    type: gate
    goal: Jump back to implement IF review fails AND retry bound is not reached
    constraints:
      - machine judgment only — never decides beyond declared jump conditions
  - id: accept
    type: approval
    goal: Accept the produced graph OR end the run
    constraints:
      - routes only — never edits the produced graph
# Maker journey — produces workflow YAML graphs (name states the operation).
description: Maker journey — produces workflow YAML graph artifacts for end-user projects.
# Graph-level ambient context — phases consume atom-graph-spec without
# per-node declaration. Three-tier channel model: CONTEXT.md arrives via the
# platform convention layer (absence-tolerant — foreign projects degrade to
# direct scoping).
context:
  - skill:atom-graph-spec
phases:
  # Maker journey — concrete graph production (single kind=graph, single
  # operation=create). No skeleton, no kind switch, no skill co-production.
  - id: entry
    type: main
    dependsOn: []
    skill: atom-scope-interview
    operations: []
    task: |
      Execute scope interview per atom-scope-interview (maker journey —
      kind=graph, operation=create; no kind switch, no skill co-production).

      Topics: graph name, topology scope (purpose, phases, skill
      dependencies), save location (default .graph-scheduler/graphs/).

      Behavior: confirm=mandatory; output path=user_owned;
      dual-name check=graph_name; context=optional.

      Output contract: graph_name, scope, save_location, scope_complete.

  # Spec — design the phase topology per atom-graph-design (design flow);
  # the skill contract derives the atom-graph-spec reference channel.
  - id: spec
    type: main
    dependsOn: [entry]
    skill: atom-graph-design
    operations: [read]
    task: |
      Execute atom-graph-design graph mode per atom-graph-design skill —
      entry scope is the design input; research → think → interview
      confirmation rounds (participation: mandatory), present design
      decisions one at a time.

      Output contract: design, graph_name (echo), save_location (echo),
      scope_complete (echo).

  # Spec accept — design confirmed before any write (spec-first).
  - id: spec-accept
    type: approval
    dependsOn: [spec]
    channels:
      - node:spec
    task: |
      Accept the graph design?

      Decision: design per atom-graph-spec — accept when complete; revise
      otherwise.

  # Implement — write artifact + registry entry + attached doc (one write
  # node = one rework target).
  - id: implement
    type: main
    dependsOn: [spec-accept]
    skill: atom-graph-writer
    operations: [read, write, run, verify]
    channels:
      - node:spec
      - node:entry
    task: |
      Execute atom-graph-writer graph mode per atom-graph-writer skill —
      produce the graph artifact per the confirmed design + atom-graph-spec.

      Three-path bundle (project convention, writer skill cannot know it):
      graph file at .graph-scheduler/graphs/<name>.yaml (default
      save_location) with the $schema + version self-description header,
      registry entry in .graph-scheduler/graphs/registry.json,
      attached usage doc at .graph-scheduler/docs/<name>.md.

      Load-probe validation: graph_start the produced graph → expect a node
      return (problems field carries load-time machine warnings, if any) → then graph_force_end the probe run.
      Report the probe result; deviations from design SHALL be reported, not
      negotiated.

      Output contract: artifact_path, registry_path, doc_path, validation
      (passed | failed + details), graph_name (echo), summary.

  # Review — kind standards injected; one review phase.
  - id: review
    type: main
    dependsOn: [implement]
    skill: code-review
    operations: [locate, read, review]
    agent: [reviewer, explore, task, general]
    channels:
      - node:entry
      - node:spec
    task: |
      Review the produced graph per code-review (use ## Agent hints for
      axis sub-agents; forward the injected ## Reference blocks — axis
      agents SHALL NOT re-discover atom-graph-spec). Standards:
      atom-graph-spec (graph definitions) + repo-documented coding
      standards. Spec: artifact matches the confirmed design.

      Output contract: report (machine-parseable YAML, overall:
      pass | fail).

  # Gate — bounded rework on FAIL (backward jump to implement).
  - id: gate
    type: gate
    dependsOn: [review]
    jumps:
      - when: 'review output shows overall: fail AND implement retryCount < 2'
        to: implement

  # Accept — final artifact approval.
  - id: accept
    type: approval
    dependsOn: [gate]
    channels:
      - node:review
    task: |
      Accept the graph?

      Decision: accept when the artifact passes review; revise/redesign
      otherwise.
