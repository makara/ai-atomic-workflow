name: estate-maintain
description: 'Estate maintenance graph — trigger-classified estate upkeep (domains-index / specs-sync / adr-align workstreams) closed by a consistency-gate + reverse-validation + deployment-mirror review.'
$schema: ../schemas/workflow.schema.json
version: 1.0.0
flow:
  - 'startup --> entry'
  - 'entry --> requirement'
  - 'requirement --> domains-index'
  - 'domains-index --> specs-sync'
  - 'specs-sync --> adr-align'
  - 'adr-align --> review'
  - 'review -->|rework| entry'
inventory:
  - id: startup
    type: main
    goal: Runs the startup template — constraints session load + serena activation + jcodemunch indexing (full startup — doc-estate maintenance edits docs against code refs)
    constraints:
      - graph entry — dependsOn empty; entry depends on it
      - no user questions — self-decide startup steps
  - id: entry
    type: main
    goal: Executes atom-scope-interview to classify the trigger THEN select workstreams
    constraints:
      - classification only — never selects workstreams beyond the declared set
  - id: requirement
    type: main
    goal: Runs grilling to confirm estate requirement decisions
    constraints:
      - never auto-gated
  - id: domains-index
    type: main
    goal: Executes atom-doc-maintain to update the domain index
    constraints:
      - never edits deployment copies — packages/ sources only
  - id: specs-sync
    type: main
    goal: Executes atom-spec-maintain to sync the spec estate
    constraints:
      - minimal changes only — delta specs, never wholesale rewrites
  - id: adr-align
    type: main
    goal: Executes atom-adr-maintain to align the ADR estate
    constraints:
      - never edits archived records — live estate only
  - id: review
    type: main
    goal: Reviews the maintenance pass with the consistency gate, reverse validation and mirror check
    constraints:
      - read-only gate — never fixes findings inline
constraints:
  - "rework bound: the rework re-entry (review -->|rework| entry) is bounded by the user's call — a fresh pass re-enters entry; a new run stays the operator's choice (PCL)"
context:
  - skill:clean-ddd-hexagonal
  - skill:domain-modeling
  - skill:codebase-design
  - skill:caveman
phases:
  - id: startup
    type: main
    dependsOn: []
    template: startup
  - id: entry
    type: main
    dependsOn: [startup]
    skill: atom-scope-interview
    operations: []
    task: |
      Execute scope interview per atom-scope-interview.

      Topics: trigger (domain-change | skill-change | proactive | user-request
      — classify from the event, never from the interview; user-request = user
      proposes special requirements for domain design), workstreams
      (domains-index | specs-sync | adr-align — which run this pass; proactive
      = all three; user-request always includes domains-index for recording).

      Behavior: confirm=mandatory; output path=derived. User-request
      requirements come from the invocation event — {args.requirements}
      when provided, else the session message.

      Output contract: trigger, workstreams, scope_complete.

  - id: requirement
    type: main
    dependsOn: [entry]
    skill: grilling
    operations: []
    task: |
      Execute grilling per grilling skill. Graph dispatch encapsulation
      contract — per the single source (task-templates/contracts.ts
      GRILLING_ENCAPSULATION_CONTRACT); never re-encode the body here.

      Scope from entry output: trigger — never re-detected. Non-user-request
      triggers SHALL report a no-op scope (zero requirements, zero decisions)
      — never fabricated work. User-request requirements come from the
      invocation event — {args.requirements} when provided, else the session
      message.

      Node-context declarations (override grilling defaults for this flow):
      1. NO ADR decision applies — user scope: requirements record into
         domains.md, not ADRs. Do not ask the ADR question; adr_created is
         always false here.
      2. Record-keeping is NOT this node's responsibility — confirmed
         requirements are emitted as node output; domains-index writes them
         into docs/domains.md Design Requirements.

      Output contract: requirements [{statement}], decisions,
      shared_understanding, trigger.

  - id: domains-index
    type: main
    dependsOn: [requirement]
    channels:
      - node:entry
    skill: atom-doc-maintain
    operations: [read, write, verify]
    task: |
      Execute the domains-index workstream per atom-doc-maintain (index class)
      consulting atom-domain-spec as format reference — split principles,
      10-100 count bound, kind layering, reverse-analysis provenance, evolution
      four-step, Design Requirements section.

      Scope from entry output: trigger, workstreams — never re-detected.
      Run the index-class maintenance rules; report changes + consistency-gate
      results (mapping / links / counts / derived) for the review node.

      Record duty (user-request trigger): consume the requirement node output
      (upstream requirement — direct dependency) and write the confirmed requirements into
      docs/domains.md Design Requirements block at the file head — format per atom-domain-spec
      §Design Requirements (bullet list, one simple sentence per requirement, no
      IDs/status/source/date). Zero confirmed requirements → no block write.

      Consumption duty: read docs/domains.md Design Requirements before
      executing; comply with every active requirement in this node's changes.

      Output contract: changes, validation, updated, requirements_recorded.

      Unselected workstreams (per entry output) SHALL report a no-op scope
      (zero changes, zero gate checks) — never fabricated work.

  - id: specs-sync
    type: main
    dependsOn: [requirement]
    channels:
      - node:entry
    skill: atom-spec-maintain
    operations: [read, run, write, verify]
    task: |
      Execute the specs-sync workstream per atom-spec-maintain — reverse-analyze
      (triple diff: disk capabilities ↔ docs/domains.md ↔ openspec/specs) →
      minimal change (delta specs only) → openspec-sync-specs → openspec archive.

      Scope from entry output: trigger, workstreams — never re-detected.
      1:1 mapping rule: spec dirs match domain IDs; orphans retired or
      registered; pure registrations touch docs/domains.md only.

      Consumption duty: read docs/domains.md Design Requirements before
      executing; comply with every active requirement in this node's changes.

      Output contract: drift, change_name?, synced, archived.

      Unselected workstreams (per entry output) SHALL report a no-op scope
      (zero drift, zero sync) — never fabricated work.

  - id: adr-align
    type: main
    dependsOn: [requirement]
    channels:
      - node:entry
    skill: atom-adr-maintain
    operations: [read, write, verify]
    task: |
      Execute the adr-align workstream per atom-adr-maintain — status
      verification vs decision reality, stale chains folded via
      atom-doc-lifecycle fold machinery, index rebuild, archive hygiene, dead
      citations repointed.

      Scope from entry output: trigger, workstreams — never re-detected.

      Consumption duty: read docs/domains.md Design Requirements before
      executing; comply with every active requirement in this node's changes.

      Output contract: findings, folds, index_rebuilt, cleaned.

      Unselected workstreams (per entry output) SHALL report a no-op scope
      (zero findings) — never fabricated work.

  - id: review
    type: main
    dependsOn: [domains-index, specs-sync, adr-align]
    channels:
      - node:entry
      - node:requirement
      - skill:atom-domain-spec
    operations: [locate, read, review]
    task: |
      Review the maintenance pass per the estate-maintain spec:
      Upstream fields: domains-index — changes / validation / updated /
      requirements_recorded (alignment standard for reverse-validation);
      requirement — requirements / decisions + shared_understanding (grill
      confirmation records);
      specs-sync / adr-align outputs feed the mapping and counts checks.
      1. Consistency gate — mapping (assets ↔ domains bidirectional; spec dirs
         ↔ domain IDs 1:1), links (no dangling targets), counts (claims match
         disk facts), derived (views match source state), requirements (Design
         Requirements block sits at the file head with bullet-list format;
         workstream changes comply with each requirement; decisions +
         shared_understanding evidence from the requirement node output —
         node:requirement channel, never
         in-file confirmation records; format valid per atom-domain-spec).
         Evidence per check; failures surfaced — never silently patched.
      2. Reverse-validation — every change traces to a real estate fact;
         registrations have decision evidence (ADR); retirements remove
         capabilities with REMOVED deltas.
      3. Graph↔skill contract alignment — every graph channel declaration is
         checked against the dispatched skill's `## Context Requirements`
         contract (reference skills / Files entries covered by declared
         channels); entry skills declaring graph-callable requirements with
         zero dispatching graph phase are flagged as orphans (agent-side
         home of the removed engine load-time pass — the engine holds no
         contract machinery).
      4. Deployment-mirror check (read-only) — diff packages/ skill set against
         the user deployment (~/.agents/skills); report residue as drift; NEVER
         edit deployment.

      Completion (auto — no user confirm): gate_results clean AND no
      deployment drift → the pass completes here (natural drain). Failures
      surfaced — never silently patched; rework via the flow rework
      condition ('rework' — re-enters entry for a fresh pass); a new run
      stays the operator's choice (PCL).

      Output contract: gate_results, deployment_drift, review_verdict.
