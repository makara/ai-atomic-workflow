name: e2e-minimal
phases:
  - id: agent-echo
    type: main
    dependsOn: []
    task: say hello in a random language.

  - id: approval-review
    type: approval
    dependsOn: [agent-echo]
    task: 'Approval Review'
    routing:
      actions:
        - action: continue
          label: 'Accept output'
          description: 'Output OK — proceed'
        - action: retry
          target: agent-echo
          label: 'Regenerate output'
          description: 'Output needs changes — re-run agent-echo with feedback'
