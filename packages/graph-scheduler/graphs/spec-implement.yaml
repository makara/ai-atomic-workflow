name: spec-implement
description: 'Non-interactive implementation graph — extract the produced change, route to the minimal/detailed track, judge completion.'
$schema: ../schemas/workflow.schema.json
version: 1.0.0
interaction: none
flow:
  - 'spec-extract --> track-accept'
  - 'track-accept --> workflow-done'
inventory:
  - id: spec-extract
    type: main
    goal: Extracts the implementation scope from the produced change
    constraints:
      - extraction only — spec production lives in the adopt stage
      - never fabricates the change name — blocked + candidates instead
  - id: track-accept
    type: main
    goal: Selects the track — minimal IF no ADR exists, detailed IF an ADR exists
    constraints:
      - routes only — never re-derives the ADR fact
      - starts exactly one track graph as a sibling run — never both
  - id: workflow-done
    type: main
    goal: Judges track completion THEN reports archive success OR incomplete judgment
    constraints:
      - judges only — never re-opens the pipeline
phases:
  - id: spec-extract
    type: main
    dependsOn: []
    operations: [read]
    task: |
      Extract the implementation scope from the produced OpenSpec change.

      Change resolution: {args.changeName} — the launching router sibling
      passes the change name + adoption echo (adr_created, decisions) via
      graph_start args (confirm the change exists);
      Change name resolution — per the single source
      (task-templates/contracts.ts CHANGE_NAME_RESOLUTION_RULE); never
      re-encode the rule body here.
      adr_created ECHOES the adoption record (passed via args), never
      re-derived.

      Output contract: scope_complete: true, input_source, change_name,
      affected_domains, spec_plan, adr_created, decision_summary, decisions,
      spec_status, candidates?.

  - id: track-accept
    type: main
    template: router
    template_args:
      paths:
        - openspec-apply
        - openspec-engineer
    dependsOn: [spec-extract]
    channels:
      - node:spec-extract

  - id: workflow-done
    type: main
    dependsOn: [track-accept]
    operations: [read]
    channels:
      - node:spec-extract
      - node:track-accept
    task: |
      Track complete.

      Incomplete judgment check: spec-extract reports spec_status: blocked →
      judgment_incomplete: true + suggest graph_jump back to the entry node;
      never present as a completed implementation. Router result: track-accept
      reports chosen_graph (openspec-apply | openspec-engineer), run_id,
      result_summary, outputs; archive echo: archive_succeeded true when the
      chosen run reports archive_status: success.

      Output contract: track (minimal | detailed | none), adr_created,
      change_name, candidates (echo when blocked), decisions (echo),
      archive_succeeded, judgment_incomplete.
