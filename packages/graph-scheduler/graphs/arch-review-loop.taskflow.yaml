name: arch-review-loop
phases:
  # Stage 1: Loop entry — scope interview. Run Mode is a run attribute decided
  # at run creation (graph_start mode param), never a graph topic.
  # Report input: existing report path (true closed loop) OR fresh review.
  # Declared FIRST — findActiveNode dispatches the entry before review/implement.
  - id: loop-entry
    type: main
    dependsOn: []
    skill: atom-scope-interview
    channels:
      - ./CONTEXT.md
    task: |
      Execute scope interview per skill://atom-scope-interview.

      Mandatory per-round scope confirmation — this interview SHALL run on EVERY
      round (loop jump-back targets this node): regardless of prior report input or
      loop round, require the user to confirm or adjust scope (domain/feature/problem
      + focus dimensions) and report_input (fresh|existing — re-confirmable across
      rounds). NEVER auto-skip; scope_complete requires user participation.

      Topics:
      1. Scope — domain/feature/problem + focus dimensions; MUST be confirmed or
         adjusted by the user each run (never assumed from a prior round).
      2. Report input: existing report path (true closed loop — re-run on a prior
         report; confirm the path exists, read its Top Recommendation) OR fresh
         review (confirm output path — path MUST be explicitly confirmed; recommend
         docs/reports/<YYYY-MM-DD>-arch-review-<topic>.md).

      Output: scope, focus, output, report_input (fresh|existing), report_path,
      scope_complete.

  # Stage 2: Review — the loop's round worker, ALWAYS runs (fresh or existing).
  # Round origin = loop-entry (dependsOn [loop-entry]): a loop jump-back to
  # loop-entry resets this whole segment (scope re-confirmed at entry each round).
  # loop-entry output arrives via the dependsOn edge (upstream block) — no channel.
  - id: review
    type: flow
    use: arch-review
    dependsOn: [loop-entry]

  # Stage 3: Implement gate — fresh mode: human decides; existing mode: report
  # pre-accepted at entry (skip). Revise removed — re-scope = new run.
  - id: review-accept
    type: approval
    dependsOn: [review]
    when: 'skip when loop-entry output shows report_input: existing (report pre-accepted at entry)'
    task: 'Implement review Top Recommendation?'
    preText: |
      Review report saved (path confirmed at loop entry — docs/reports, date prefix).
      Implement → openspec-pipeline runs. Stop → report only (re-scope = a new run).
    routing:
      actions:
        - action: continue
          label: 'Implement Top Recommendation'
          description: 'Run openspec-pipeline to implement the review Top Recommendation'
        - action: continue
          label: 'Stop — report only'
          description: 'Keep the report; no implementation'

  # Stage 4: Implementation — dependsOn [review-accept]: the jump closure from a
  # loop-entry retry resets this segment via review-accept (each round re-runs the
  # pipeline only when the accept decision says Implement; Stop/existing flow
  # guards decide skip). node:loop-entry channel delivers report_path — the
  # pipeline reads the CURRENT report each round. Nested approvals obey Run Mode
  # via the run field — no per-node declarations.
  - id: implement
    type: flow
    use: openspec-pipeline
    dependsOn: [review-accept]
    channels:
      - node:review/arch-review
      - node:loop-entry
    when: 'run only when review/arch-review output shows top_rec_remaining: true AND (review-accept output shows decision label Implement Top Recommendation OR loop-entry output shows report_input: existing); skip when review-accept shows Stop — report only'

  # Stage 5: Auto loop router — machine retry branch (auto mode + accepted report +
  # Top Rec remains → retry LOOP-ENTRY: the whole round re-runs from the entry
  # scope interview). No-match falls through to loop-accept.
  # eval reads the round worker's structured output (review/arch-review — unified
  # output contract); conditions reference contract fields only (Eval Rule 1).
  # `round < 8` bounds the gate's retry (hygiene) — it is NOT a termination
  # mechanism: no Top Rec → loop-accept when-skip ends the loop normally; with a
  # Top Rec remaining, ending is still a human decision (force-end in auto).
  - id: loop-gate
    type: gate
    dependsOn: [review/arch-review, loop-entry, review-accept]
    eval:
      - when: 'run mode is auto AND (review-accept output shows decision label Implement Top Recommendation OR loop-entry output shows report_input: existing) AND review/arch-review output shows top_rec_remaining: true AND review/arch-review output shows round < 8'
        action: retry
        target: loop-entry
        note: 'auto mode — re-review from the loop entry while a Top Recommendation remains (entry scope re-confirmed each round)'

  # Stage 6: Round-end approval — end-of-round decision. Default = Loop again
  # (manual recommendation + auto execution) → retry LOOP-ENTRY (whole round,
  # scope re-confirmed). when-skip: no Top Recommendation remains → normal end
  # (loop-done), NOT force-end. With candidates, termination is still a human
  # decision: card in manual mode, operator force-end in auto mode.
  - id: loop-accept
    type: approval
    dependsOn: [loop-gate]
    when: 'skip when review/arch-review output shows top_rec_remaining: false (no Top Recommendation remains — normal end)'
    task: 'End the review loop?'
    preText: |
      The report was re-reviewed and updated at the confirmed path (no re-confirmation).
      Loop again → re-run from the loop entry (scope re-confirmed, report re-reviewed).
      Complete → the user explicitly ends the loop.
    routing:
      actions:
        - action: retry
          target: loop-entry
          label: 'Loop again — re-review the report'
          description: 'Re-run from the loop entry: scope re-confirmed, same report re-reviewed (default — repeat)'
        - action: continue
          label: 'Complete loop'
          description: 'User-approved end — the loop finishes'

  # Stage 7: Terminal — normal end (no remaining Top Rec or user-approved end)
  - id: loop-done
    type: main
    dependsOn: [loop-accept]
    task: 'Loop complete — normal end (no remaining Top Recommendation — loop-accept when-skipped, report round marker is the evidence; or user approved ending — loop-accept decision). Report at confirmed path.'
