name: e2e-minimal
$schema: ../schemas/workflow.schema.json
version: 1.0.0
# Node overview table (atom inventory). Bounded compound goals:
# connectors AND/THEN/IF-ELSE/OR — structural keywords ALL-CAPS (AND/OR/IF/
# THEN/ELSE), prose and/or lowercase, ≤ 5 steps, gates ≤ 3 AND/OR operands,
# conditional paths ≤ 3. Entry shape { id, type, goal, constraints? } — goal
# states the atom's intent; mechanism lives in the goal (flow entries state
# "expands <use> subgraph"). constraints: one-sentence prose rules — general
# boundaries + explicit non-goals, ≤ 5 per atom, never machine-validated.
# User-maintained.
inventory:
  - id: agent-echo
    type: main
    goal: Executes the echo step THEN reports the result
    constraints:
      - demo only — echoes the input, no real work
  - id: approval-review
    type: approval
    goal: Accept the demo result OR end the run
    constraints:
      - re-runs the echo until accepted — no other route
phases:
  - id: agent-echo
    type: main
    dependsOn: []
    operations: []
    task: |
      Say hello in a random language.

      Output contract: greeting (random-language hello text).

  - id: approval-review
    type: approval
    dependsOn: [agent-echo]
    task: |
      Approval Review

      Decision: accept when the agent output is correct; regenerate
      otherwise.
