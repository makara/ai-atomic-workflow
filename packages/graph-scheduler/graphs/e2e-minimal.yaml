name: e2e-minimal
description: 'Minimal E2E: main → main confirmation loop'
$schema: ../schemas/workflow.schema.json
version: 1.0.0
flow:
  - 'approval-review -->|rework| agent-echo'
inventory:
  - id: agent-echo
    type: main
    goal: Executes the echo step THEN reports the result
    constraints:
      - demo only — echoes the input, no real work
  - id: approval-review
    type: main
    goal: Confirms the echo result — accept IF correct, ELSE regenerate
    constraints:
      - re-runs the echo until accepted — no automatic retry
constraints:
  - "rework bound: the rework re-entry (approval-review -->|rework| agent-echo) is bounded by the user's acceptance decision — never automatic; the run drains on accept"
phases:
  - id: agent-echo
    type: main
    dependsOn: []
    operations: []
    task: |
      Say hello in a random language.

      Output contract: greeting (random-language hello text).

  - id: approval-review
    type: main
    dependsOn: [agent-echo]
    operations: []
    task: |
      Echo result review.

      Interview: confirm the agent output is correct. IF correct — accept
      (no condition; the run drains). IF not — report the rework condition
      ('rework' — the flow edge re-enters agent-echo for regeneration) —
      no automatic retry. End the demo early — direct end.
      direct end: end the round.
