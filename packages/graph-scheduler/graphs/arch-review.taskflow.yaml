name: arch-review
# Graph-level ambient context — design vocabulary serves every main phase.
# Three-tier channel model: conventions (CONTEXT.md, docs/domains.md) are
# platform-shipped and absence-tolerant; project layout (ADR records) arrives
# via config.json context when the project declares it.
context:
  - skill:codebase-design
phases:
  # Requirement production — scope-entry → arch-review → review-accept
  # (loop composition composes this graph whole as its requirement stage).
  - id: scope-entry
    type: main
    dependsOn: []
    skill: atom-scope-interview
    task: |
      Execute scope interview per atom-scope-interview.

      Topics: scope (domain/feature/problem + focus dimensions), report
      input (fresh | existing — report_path carries the confirmed path).

      Behavior: confirm=mandatory; output path=user_owned (recommend
      docs/reports/<YYYY-MM-DD>-arch-review-<topic>.md).

      Loop jump-backs target this node.

      Scope proposal: a report exists (report_input: existing, or the
      previous round's arch-review output shows round >= 1) AND the user
      gives no explicit new scope → MUST propose scope = verify the
      implementation results against the report (evidence-backed) and
      surface new problems; never re-propose the prior round's scope
      verbatim.

      Output contract: scope, focus, output, report_input
      (fresh|existing), report_path, scope_complete.

  # Report production — improve-codebase-architecture (producer).
  - id: arch-review
    type: main
    dependsOn: [scope-entry]
    skill: improve-codebase-architecture
    agent: [explore, scout, task, general]
    task: |
      Execute architecture review per improve-codebase-architecture (use ## Agent hints for the Explore sub-agent).

      Scope from scope-entry output: scope, focus, report_path, report_input —
      never re-detected, never re-interviewed.
      report_input fresh → write markdown (NOT HTML) report at report_path.
      report_input fresh AND report_path exists (round ≥ 2) OR existing →
      re-review: read report at report_path (single source of truth — NO path re-confirmation),
      mark
      implementation progress per Top Rec item (evidence-backed), review
      defects (findings cards), update report in place (condense implemented
      content, rewrite Top Rec), increment round marker.

      Findings cards: Files / Problem / Solution / Benefits (locality +
      leverage + testability) / Recommendation strength (Strong | Worth
      exploring | Speculative). End with Top recommendation + Decision Request
      (Context, Auto-recorded debt, Blocking findings, Dispatch record,
      Suggested advance label).

      Output contract: report_path, round, implemented, new_findings, top_rec,
      top_rec_remaining, summary.

  # Requirement accept — Continue → requirement ready; Loop again → retry
  # scope-entry; End → end action.
  - id: review-accept
    type: approval
    dependsOn: [arch-review]
    channels:
      - node:scope-entry
    task: |
      Requirement ready?

      Decision: Continue — requirement ready (report at report_path is the
      requirement artifact; loop composition activates adopt). Loop again —
      re-review round (retry scope-entry). End — no requirement. Top Rec
      remains → Continue; none → End.
