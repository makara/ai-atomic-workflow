name: arch-review
phases:
  # Scope interview — entry node (route-first: no forward gate). Case-5
  # self-judgment: when composed into arch-review-loop, the loop entry
  # pre-confirms the scope (loop-entry output shows scope_complete: true) —
  # this node discovers no work and completes with an empty output (execution,
  # not a skip). Standalone (no loop-entry output) → the interview runs.
  - id: scope-detect-interview
    type: main
    dependsOn: []
    skill: atom-scope-interview
    channels:
      - ./CONTEXT.md
    task: |
      Execute scope interview per atom-scope-interview.

      Case-5 self-judgment: if loop-entry output (injected channel) shows
      scope_complete: true (loop composition — scope pre-confirmed at the loop
      entry), this node has NO WORK — output scope_complete: true (echo) and
      finish; the interview itself is skipped by the workflow state, not by a
      skip mechanism.
      Otherwise conduct the interview:
      Topics: architecture review domain/feature/problem; focus dimensions (depth/coupling/testability/naming/duplication); output path — MUST be explicitly confirmed by user.
      Recommend default output path: docs/reports/<YYYY-MM-DD>-arch-review-<topic>.md (date prefix — new convention); user MUST explicitly confirm, may override.

      Output: scope, focus, output, scope_complete.

  # Execute architecture review with confirmed scope — from scope-detect-interview
  # (standalone interview) or with the loop pre-confirmed scope (loop composition).
  - id: arch-review
    type: main
    dependsOn: [scope-detect-interview]
    skill: improve-codebase-architecture
    agent: [explore, scout, task, general]
    channels:
      - node:loop-entry
      - ./CONTEXT.md
      - docs/adr/*.md
      - skill:codebase-design
    task: |
      Execute architecture review per improve-codebase-architecture (use ## Agent hints for the Explore sub-agent).

      Scope: read scope-detect-interview output (injected) — scope, focus, confirmed output path.
      Loop composition (scope pre-confirmed at the loop entry — loop-entry output shows scope_complete: true):
      the scope comes from the loop-entry output (injected channel).
      Report input (from loop-entry output — injected channel):
      - report_input: fresh → current behavior: markdown (NOT HTML) written to the confirmed output path.
      - report_input: fresh AND the report file at report_path already exists (round ≥ 2 — a
        previous round produced the report) → transition to re-review semantics: treat as existing —
        read the report at report_path (single source of truth, NO path re-confirmation), mark
        implementation progress per Top Recommendation item (evidence-backed status), review the
        implementation for defects (findings cards), update the report in place (condense/archive
        implemented content, rewrite Top Recommendation — strongest remaining candidate or empty),
        increment the round marker.
      - report_input: existing → closed-loop re-review mode: read the report at report_path (confirmed at
        loop entry — single source of truth, NO path re-confirmation). Mark implementation progress per
        Top Recommendation item (evidence-backed status — pipeline change evidence + code walk). Review the
        implementation for defects (findings cards). Update the report in place — condense/archive
        implemented content, rewrite Top Recommendation (strongest remaining candidate, or empty).
        Increment the round marker.
      Output contract (both modes): report_path, round (increment), implemented (list),
      new_findings (count), top_rec (new Top Rec or empty), top_rec_remaining (true|false),
      summary (one line).
      For each finding, render markdown card — Files / Problem / Solution /
      Benefits (locality + leverage + testability) / Recommendation strength
      (Strong | Worth exploring | Speculative).
      End with Top recommendation + Decision Request section (Context,
      Auto-recorded debt, Blocking findings, Dispatch record, Suggested advance label).
