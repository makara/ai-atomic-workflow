name: skill-author
phases:
  # Mode detection: create vs edit (case-5 self-judgment — mode-gate deleted)
  # create path: scope-confirm → skill-write → skill-review → skill-accept → output-examples
  # edit path: scope-confirm → skill-select → edit-scope-confirm → skill-edit-write → skill-review → skill-accept → output-examples

  # --- Shared entry: scope confirmation ---
  - id: scope-confirm
    type: main
    dependsOn: []
    skill: atom-scope-interview
    channels:
      - ./CONTEXT.md
    task: |
      Execute scope interview per atom-scope-interview.
      Flow context: prefer upstream plan-parse skill_create_name (injected when orchestrated); else interview (skill Step 1).

      Topics: skill name and purpose; scope (what problem it solves); input/output contract (files/types needed and produced); dependencies (skills loaded via skill); save location.

      Output: confirmed scope (name, purpose, inputs, outputs), full skill plan (sections, references, context requirements, trigger phrases), scope_complete: true, save_location.

  # --- Create path: write new skill (case-5: edit mode → no work) ---
  - id: skill-write
    type: main
    dependsOn: [scope-confirm]
    skill: atom-skill-writer
    task: |
      Case-5 self-judgment: if scope-confirm output does not show save_location
      AND no skill_path (edit mode — a skill_path is present), this node has NO
      WORK — output empty (no SKILL.md written) and finish; this is normal
      execution, not a skip.

      Otherwise write skill per confirmed plan using atom-kernel interview() solve mode for content confirmation.

      Read scope-confirm output (injected).

      Execute interview({ goal: "write SKILL.md for confirmed scope", research: true, context }) in solve mode:

      confirm(goal): Confirm writing scope with user — verify plan still accurate.

      research: Load atom-skill-spec (injected). Look up frontmatter format rules, body content rules, language constraints, reference constraints.

      think: Draft complete SKILL.md — frontmatter (name, description, version), body sections per plan, context requirements. Validate every atom-skill-spec rule.

      interview(details): Present content decisions one at a time — frontmatter fields, section structure, trigger phrases. User rejects → return to think.

      Output: When all confirmed, write SKILL.md to save_location. Write output path + summary (main agent collects).
    channels:
      - skill:atom-skill-spec

  # --- Edit path: select existing skill (case-5: create mode → no work) ---
  - id: skill-select
    type: main
    dependsOn: [scope-confirm]
    task: |
      Case-5 self-judgment: if scope-confirm output does not show skill_path
      (create mode — no existing skill to edit), this node has NO WORK — output
      empty (no skill_path) and finish; this is normal execution, not a skip.

      Otherwise conduct consensus interview per atom-kernel §interview() to confirm edit target.

      1. Accept skill path or name from user input.
      2. Load existing SKILL.md — read frontmatter + body structure.
      3. Present current state to user: name, description, sections.
      4. Confirm: "This is the skill you want to edit?"
      5. Write target (main agent collects):
        - skill_path: <path>
        - skill_name: <name>
        - current_frontmatter: <summary>
        - current_sections: [list]

  # --- Edit path: confirm edit scope (case-5: create mode → no work) ---
  - id: edit-scope-confirm
    type: main
    dependsOn: [skill-select]
    task: |
      Case-5 self-judgment: if skill-select output shows no skill_path (create
      mode — no edit target), this node has NO WORK — output empty and finish;
      this is normal execution, not a skip.

      Otherwise interview to confirm edit scope per atom-scope-interview. If plan incomplete, continue interview() solve mode until scope_complete: true.

      Read skill-select output (injected via dependsOn implicit context).
      Interview per atom-kernel §interview() — one-at-a-time, recommendation-first:
      - What to change: description, trigger phrases, body sections, remove sections?
      - Scope of each change: full rewrite or incremental?
      - Any new skill dependencies to add or remove?
      Assess plan completeness:
      - Plan "complete" if all changes specified with clear diff plan
      - If scope_complete: false → continue interview() solve mode: research atom-skill-spec rules → think diff plan → interview → repeat until scope_complete: true
      Write output (main agent collects):
        - scope_complete: true
        - changes: [list of change descriptions]
        - diff_plan: [detailed section-by-section diff]
        - dependencies: [skill refs to add/remove]
        - trigger_phrases: [updates]

  # --- Edit path: apply edits (case-5: create mode → no work) ---
  - id: skill-edit-write
    type: main
    dependsOn: [edit-scope-confirm]
    skill: atom-skill-writer
    task: |
      Case-5 self-judgment: if skill-select output shows no skill_path (create
      mode — nothing to edit), this node has NO WORK — output empty (no diff)
      and finish; this is normal execution, not a skip.

      Otherwise modify SKILL.md per confirmed diff plan using atom-kernel interview() solve mode for content confirmation.

      Read skill-select output, edit-scope-confirm output (both injected).

      Execute interview({ goal: "apply edits to SKILL.md as planned", research: true, context }) in solve mode:

      confirm(goal): Confirm edit scope with user — verify plan still accurate.

      research: Load atom-skill-spec (injected). Verify edit plan complies with all atom-skill-spec rules.

      think: Perform in-place edits — frontmatter changes, section updates, section removals. Validate modified skill against every atom-skill-spec rule.

      interview(details): Present edit results one at a time — changed sections, new content. User rejects → return to think.

      Output: When all confirmed, write modified SKILL.md (overwrite existing — backup original). Write before/after diff (main agent collects).
    channels:
      - node:skill-select
      - skill:atom-skill-spec

  # --- Shared: review (create or edit output) ---
  # Default join (all) — both writers run unconditionally now (case-5); review
  # waits for BOTH to complete (the no-work writer finishes with an empty
  # output). No explicit join: all — join accepts only 'any'; the default is all.
  - id: skill-review
    type: main
    dependsOn: [skill-write, skill-edit-write]
    skill: code-review
    agent: [reviewer, explore, task, general]
    task: |
      Review SKILL.md per code-review (use ## Agent hints for axis sub-agents).

      Artifact: SKILL.md path from skill-write or skill-edit-write output (injected) — exactly one writer produces the artifact (create → skill-write, edit → skill-edit-write; the other is a case-5 no-work node with an empty output).
      Standards: atom-skill-spec (injected) — structural rules (frontmatter + body + language + reference).
      Spec: scope-confirm output (injected) — skill matches confirmed scope. Edit mode: additionally read the edit-scope-confirm upstream output (present only in edit mode) — check frontmatter consistency, section structure integrity, no orphan references.

      Output machine-parseable YAML with overall: pass | fail. Write report (main agent collects).
    channels:
      - node:scope-confirm
      - skill:atom-skill-spec

  # --- Shared: approval gate ---
  # Dual-writer graph (create skill-write / edit skill-edit-write, mutually
  # exclusive by mode) — no single rework point: no auto-rework, the human
  # card decides; per-mode retry targets are AI-generated dynamic options
  # (single-writer auto-rework scope rule).
  - id: skill-accept
    type: approval
    dependsOn: [skill-review]
    task: |
      Accept the skill?

      Skill written/edited per confirmed scope and reviewed (code-review
      output). Recommendation follows the review verdict (overall: pass |
      fail); free input overrides. Dynamic options include revise (re-run the
      active writer — skill-write for create mode, skill-edit-write for edit
      mode) and revise plan (jump back to scope-confirm).

  # --- Shared: output ---
  - id: output-examples
    type: main
    dependsOn: [skill-accept]
    task: |
      Generate usage examples for the skill.

      Read skill-write / skill-edit-write / skill-review upstream output files.
      If create mode: produce 2-3 concrete invocation examples.
      If edit mode: produce before/after diff summary.
      Write output (main agent collects).
