name: graph-maintain
description: "Maintenance flow — audits a graph's inventory compliance and content-vs-inventory consistency, proposes fixes, applies approved ones as an inline flow loop."
$schema: ../schemas/workflow.schema.json
version: 1.0.0
flow:
  - 'startup --> entry'
  - 'entry --> audit'
  - 'audit --> propose'
  - 'propose --> approval'
  - 'approval --> execute'
  - 'execute --> review'
  - 'review -->|fail| execute'
  - 'review -->|pass| __handoff'
inventory:
  - id: startup
    type: main
    goal: Runs the startup template — constraints session load + serena activation + jcodemunch indexing (full startup — audits graphs against the engine schema)
    constraints:
      - graph entry — dependsOn empty; entry depends on it
      - no user questions — self-decide startup steps
  - id: entry
    type: main
    goal: Executes atom-scope-interview to confirm the target graph AND the maintenance intent
    constraints:
      - target graph via graph_assets — never guesses
  - id: audit
    type: main
    goal: Executes atom-graph-writer maintain mode to audit inventory compliance AND content-vs-inventory AND in-graph declarations
    constraints:
      - read-only audit — never fixes findings inline
      - machine checks = inventory id/type + flow edges (endpoints resolve, self-loop bound in constraints prose) — no new axis beyond these
  - id: propose
    type: main
    goal: Converts audit findings into per-finding fix proposals (target, change, rationale)
    constraints:
      - proposals only — never applies without approval
      - zero findings → zero proposals — never fabricated
  - id: approval
    type: main
    goal: Confirms the fix proposals — accept proceeds, rework revisits
    constraints:
      - mandatory user gate — never auto-applies fixes
  - id: execute
    type: main
    goal: Applies approved proposals across the two-path bundle THEN runs the load-probe
    constraints:
      - applies approved proposals only — never unapproved changes
      - two-path bundle — never a partial update
  - id: review
    type: main
    goal: Reviews the executed maintenance pass against the approved proposals THEN reports the round condition (overall pass | fail — fail routes the flow self-edge re-entry)
    constraints:
      - read-only — never re-applies fixes
constraints:
  - "loop bound: the flow self-edge re-entry (review -->|fail| execute) is bounded by the review condition 'pass' or the retry bound (2 rounds — retryCount tracks re-entries, never zeroed); past the bound the review drains"
  - 'round condition vocabulary: fail | pass — flow-defined, matched mechanically (zero machine validation axis; governance = graph-maintain flow audit + user maintenance)'
context:
  - skill:atom-graph-spec
  - skill:atom-graph-writer
phases:
  - id: startup
    type: main
    dependsOn: []
    template: startup
  - id: entry
    type: main
    dependsOn: [startup]
    skill: atom-scope-interview
    operations: []
    task: |
      Execute scope interview per atom-scope-interview (maintenance flow —
      kind=graph, operation=maintain; the target graph is resolved via the
      graph asset query surface — graph_assets — never guessed from file names).

      Topics: target graph (name — resolved via graph_assets to path +
      description + current problems), maintenance intent (audit only |
      audit + fix).

      Behavior: confirm=mandatory; output path=derived;
      dual-name check=none; context=optional.

      Output contract: target_graph, maintenance_intent, scope_complete.

  - id: audit
    type: main
    dependsOn: [entry]
    skill: atom-graph-writer
    operations: [read, locate]
    channels:
      - node:entry
    task: |
      Execute atom-graph-writer maintain mode audit per atom-graph-writer
      skill — machine checks: inventory id/type vs phases (per load-time
      contract-pass semantics), description drift (the graph definition's
      top-level description — catalog single source; registry entries are
      a pure {name, path} index — mentioning a phase not in the graph),
      in-graph declaration existence
      (comments/task-text referencing fields or mechanisms that do not
      exist — stale declaration = finding, incl. removed `template: loop`
      references), flow edges (every edge source/target resolves to a
      declared phase id — the load-probe rejects dangling endpoints; a
      self-loop's bound appears in the graph's constraints prose); LLM
      checks: phase task content vs inventory description (semantic
      drift), flow-vs-inventory semantic drift (flow edges contradict
      inventory goals/constraints), condition-label consistency (labels
      in the user-maintained vocabulary — zero machine validation axis),
      in-graph declaration
      semantics (LLM judgment — no machine axis).

      Scope from entry output: target_graph — never re-detected. Report
      findings per check with evidence, never silently patched.

      Output contract: findings [{check, severity, evidence}],
      target_graph (echo).

  - id: propose
    type: main
    dependsOn: [audit]
    skill: atom-graph-writer
    operations: [read]
    channels:
      - node:audit
    task: |
      Convert audit findings into fix proposals per atom-graph-writer
      maintain mode — one proposal per finding: target (graph YAML /
      registry entry), change, rationale. Zero findings →
      report no-op scope (zero proposals) — never fabricated work.

      Output contract: proposals [{target, change, rationale}],
      target_graph (echo).

  - id: approval
    type: main
    dependsOn: [propose]
    operations: []
    channels:
      - node:propose
    task: |
      Accept the fix proposals? (inline interview — human confirms at this
      boundary; branch choice via IF/ELSE.)

      Decision: accept when proposals are sound — execute applies them;
      revise otherwise — iterate the proposals in-conversation (re-audit /
      re-propose) before execute dispatches; completion without applying —
      direct end (no fixes applied).
      direct end: end the round.

  - id: execute
    type: main
    dependsOn: [approval]
    skill: atom-graph-writer
    operations: [read, write, run, verify]
    channels:
      - node:propose
      - node:review
    task: |
      Execute atom-graph-writer maintain mode execute per atom-graph-writer
      skill — apply the approved proposals across the two-path bundle
      (graph YAML + registry entry) in one pass, never a partial bundle
      update.

      Load-probe validation per atom-graph-writer §Execute. Report the probe
      result; deviations from proposals SHALL be reported, not negotiated.

      Output contract: applied [{path, change}], validation
      (passed | failed + details), target_graph (echo), summary.

  - id: review
    type: main
    dependsOn: [execute]
    skill: code-review
    operations: [locate, read, review]
    agent: [reviewer, explore, task, general]
    channels:
      - node:execute
    task: |
      Review the executed maintenance pass per code-review (use ## Agent
      hints for axis sub-agents; forward the injected ## Reference blocks —
      axis agents SHALL NOT re-discover atom-graph-spec). Standards:
      atom-graph-spec (graph definitions) + repo-documented coding
      standards. Spec: executed changes match the approved proposals
      (two-path bundle consistent).

      Round condition: report overall (pass | fail) — the flow-defined
      round condition: 'fail' → the flow self-edge re-runs execute;
      'pass' → drain. The retry bound (2 rounds — retryCount, never
      zeroed) caps re-entries; past the bound the review drains (report
      pass) so the run continues.

      Output contract: report (machine-parseable YAML, overall:
      pass | fail).
