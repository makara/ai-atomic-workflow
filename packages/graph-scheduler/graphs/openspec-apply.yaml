name: openspec-apply
description: 'OpenSpec apply workflow — implement change tasks, dual-axis review, bounded inline rework loop, plain archive.'
$schema: ../schemas/workflow.schema.json
version: 1.0.0
flow:
  - 'change-review -->|fail| apply-change'
  - 'change-review -->|pass| archive'
  - 'change-review --> archive'
inventory:
  - id: apply-change
    type: main
    goal: Executes openspec-apply-change to implement the change tasks
    constraints:
      - implements tasks only — never produces specs (adopt stage owns them)
  - id: change-review
    type: main
    goal: Runs code-review over the applied diff THEN reports the round condition (overall pass | fail — fail routes the flow self-edge re-entry)
    constraints:
      - reports findings — never fixes inline
  - id: archive
    type: main
    goal: Executes openspec-archive-change to finalize and archive the change
    constraints:
      - finalize + archive only — never re-implements
constraints:
  - "loop bound: the flow self-edge re-entry (change-review -->|fail| apply-change) is bounded by the review condition 'pass' or the retry bound (2 rounds — retryCount tracks re-entries, never zeroed); past the bound the review drains (continues to archive)"
  - 'round condition vocabulary: fail | pass — flow-defined, matched mechanically (zero machine validation axis; governance = graph-maintain flow audit + user maintenance)'
phases:
  - id: apply-change
    type: main
    dependsOn: []
    skill: openspec-apply-change
    operations: [read, write, run, verify]
    channels:
      - node:change-review
    task: |
      Implement tasks from the confirmed openspec change per
      openspec-apply-change.

      Spec standards per affected domain — per atom-skill-spec §Domain Spec
      Standards Mapping.

      Change name resolution — per the single source
      (task-templates/contracts.ts CHANGE_NAME_RESOLUTION_RULE); never
      re-encode the rule body here.
      Re-run rounds: fix every prior change-review finding FIRST, then
      continue.

      Output contract: change_name, apply_status (complete | blocked |
      partial), changed_files, spec_paths, blocked_reason.

  - id: change-review
    type: main
    dependsOn: [apply-change]
    skill: code-review
    operations: [locate, read, review]
    agent: [reviewer, explore, task, general]
    channels:
      - node:apply-change
    task: |
      Dual-axis review of the openspec change implementation per code-review
      (use ## Agent hints for axis sub-agents). Spec: the change's delta
      specs — every SHALL requirement implemented.

      Spec standards per affected domain — per atom-skill-spec §Domain Spec
      Standards Mapping + repo-documented coding standards.

      Round condition: report overall (pass | fail) — the flow-defined
      round condition: 'fail' → the flow self-edge re-enters apply-change
      (re-runs the apply+review round with the review findings); 'pass'
      (or no condition) → the normal chain continues to archive. The
      retry bound (2 rounds — retryCount, never zeroed) caps re-entries;
      past the bound the review drains (report pass) so the run
      continues to archive.

      Output contract: report (machine-parseable YAML, overall:
      pass | fail).

  - id: archive
    type: main
    dependsOn: [change-review]
    skill: openspec-archive-change
    operations: [read, run, archive]
    channels:
      - node:apply-change
    task: |
      Archive the completed openspec change per openspec-archive-change
      (plain archive — no reverse-validation; advisory context only).
      Change name: apply-change's reported change_name (echo); run only
      when the final apply_status (apply-change) is complete or partial
      (implemented portions archived).

      Output contract: archive_status (success | failed | blocked),
      change_name, validation_result, message.
