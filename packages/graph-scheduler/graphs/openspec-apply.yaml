name: openspec-apply
$schema: ../schemas/workflow.schema.json
version: 1.0.0
# Node overview table (atom inventory). Bounded compound goals:
# connectors AND/THEN/IF-ELSE/OR — structural keywords ALL-CAPS (AND/OR/IF/
# THEN/ELSE), prose and/or lowercase, ≤ 5 steps, gates ≤ 3 AND/OR operands,
# conditional paths ≤ 3. Entry shape { id, type, goal, constraints? } — goal
# states the atom's intent; mechanism lives in the goal (flow entries state
# "expands <use> subgraph"). constraints: one-sentence prose rules — general
# boundaries + explicit non-goals, ≤ 5 per atom, never machine-validated.
# User-maintained.
inventory:
  - id: apply-change
    type: main
    goal: Executes openspec-apply-change to implement the change tasks
    constraints:
      - implements tasks only — never produces specs (adopt stage owns them)
  - id: change-review
    type: main
    goal: Runs code-review over the applied diff THEN reports findings
    constraints:
      - reports findings — never fixes inline
  - id: change-gate
    type: gate
    goal: Jump back to apply-change IF review fails AND retry bound is not reached
    constraints:
      - machine judgment only — never decides beyond declared jump conditions
  - id: change-accept
    type: approval
    goal: Accept the implementation IF review passes AND the gate is clean
    constraints:
      - routes only — never edits the change
  - id: archive
    type: main
    goal: Executes openspec-archive-change to finalize and archive the change
    constraints:
      - finalize + archive only — never re-implements
phases:
  # Apply — implement the confirmed openspec change (entry contract).
  - id: apply-change
    type: main
    dependsOn: []
    skill: openspec-apply-change
    operations: [read, write, run, verify]
    channels:
      - node:change-review
    task: |
      Implement tasks from the confirmed openspec change per
      openspec-apply-change.

      Spec standards per affected domain — deterministic mapping rule:
      graph → atom-graph-spec, skill → atom-skill-spec, doc →
      atom-doc-maintain. Determine the change's affected files (delta
      spec domains / openspec instructions apply contextFiles), load each
      corresponding spec skill BEFORE writing, and validate the
      implementation against its rule classes (deterministic rules →
      validation errors, heuristic rules → warnings) while writing.

      Change name resolution — NEVER ask: {args.changeName} → openspec list
      --json single active → apply_status: blocked + candidates. Re-run
      rounds: fix every change-review finding FIRST, then continue.

      Output contract: change_name, apply_status (complete | blocked |
      partial), changed_files, spec_paths, blocked_reason.

  # Review — dual-axis audit of the implementation.
  - id: change-review
    type: main
    dependsOn: [apply-change]
    skill: code-review
    operations: [locate, read, review]
    agent: [reviewer, explore, task, general]
    channels:
      - node:apply-change
    task: |
      Dual-axis review of the openspec change implementation per code-review
      (use ## Agent hints for axis sub-agents). Spec: the change's delta
      specs — every SHALL requirement implemented.

      Spec standards per affected domain — deterministic mapping rule:
      graph → atom-graph-spec, skill → atom-skill-spec, doc →
      atom-doc-maintain. Determine the change's affected files, load each
      corresponding spec skill, validate the implementation against its rule
      classes (deterministic rules → validation errors, heuristic rules →
      warnings) + repo-documented coding standards.

      Output contract: report (machine-parseable YAML, overall:
      pass | fail).

  # Gate — bounded rework on FAIL (backward jump to apply-change).
  - id: change-gate
    type: gate
    dependsOn: [change-review]
    jumps:
      - when: 'change-review output shows overall: fail AND apply-change retryCount < 2'
        to: apply-change

  # Accept — decision confirmation.
  - id: change-accept
    type: approval
    dependsOn: [change-gate]
    channels:
      - node:change-review
    task: |
      Accept the implementation?

      Decision: continue (approve + archive) when the implementation passes
      review; revise/restart otherwise.
  # Archive — plain change archival (minimal track: no reverse-validation,
  # no ADR fold — the original openspec-archive-change contract).
  - id: archive
    type: main
    dependsOn: [change-accept]
    skill: openspec-archive-change
    operations: [read, run, archive]
    channels:
      - node:apply-change
    task: |
      Archive the completed openspec change per openspec-archive-change
      (plain archive — no reverse-validation; advisory context only).
      Change name: apply-change output change_name (echo); run only when
      apply_status is complete or partial (implemented portions archived).

      Output contract: archive_status (success | failed | blocked),
      change_name, validation_result, message.
