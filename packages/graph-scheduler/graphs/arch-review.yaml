name: arch-review
description: 'Non-interactive requirement production graph — pure analysis chain (explore → first-principles → present-candidates) launched as a sibling run.'
$schema: ../schemas/workflow.schema.json
version: 1.0.0
interaction: none
flow:
  - 'explore --> first-principles'
  - 'first-principles --> present-candidates'
inventory:
  - id: explore
    type: main
    goal: Runs improve-codebase-architecture Step 1 to walk the codebase THEN collect friction evidence
    constraints:
      - read-only walk — no edits, no git ops
  - id: first-principles
    type: main
    goal: Runs first-principles analysis over the requirement input AND the explore digest THEN emits the rebuilt design
    constraints:
      - pure analysis — no interview, no user questions
  - id: present-candidates
    type: main
    goal: Executes improve-codebase-architecture Step 2 to compose findings from the explore digest AND the first-principles output THEN update the report in place, preserving the upstream thinking chain
    constraints:
      - report updated in place — no path re-confirmation
      - never fabricates findings — evidence-backed only
context:
  - skill:codebase-design
phases:
  - id: explore
    type: main
    dependsOn: []
    skill: improve-codebase-architecture
    operations: [locate, read]
    agent: [explore, scout, task, general]
    task: |
      Execute Step 1 Explore per improve-codebase-architecture (use ## Agent
      hints for the sub-agent codebase walk).

      Scope from the launch args (passed by the framework's router node via
      graph_start): scope, focus, report_path, report_input — never
      re-detected, never re-interviewed.
      Scope-before-scan: user-named direction taken; otherwise walk
      recent-commit hot spots, read the domain glossary (CONTEXT.md) and
      ADRs in the touched area, spawn a sub-agent to walk the codebase,
      note friction organically: shallow modules (interface nearly as
      complex as implementation), tightly coupled seams, untested parts;
      apply the deletion test to suspects.

      Output contract: explore_digest (friction points / candidate areas,
      evidence-backed, compressed).

  - id: first-principles
    type: main
    dependsOn: [explore]
    skill: first-principles
    operations: [read]
    channels:
      - node:explore
    task: |
      Execute first-principles skill Steps 1–4 (no interview, no user
      questions — pure analysis; process per the skill body).

      Inputs: the requirement input ({args.requirementInput} — passed by the
      launching router via graph_start args) + explore_digest from
      node:explore (the evidence input).

      Output contract: principles_output (assumption list / law-vs-convention
      table with evidence / atomic components / rebuilt solution design,
      compressed).

  - id: present-candidates
    type: main
    dependsOn: [first-principles]
    skill: improve-codebase-architecture
    operations: [write, review]
    channels:
      - node:explore
      - node:first-principles
    task: |
      Execute Step 2 Present candidates per improve-codebase-architecture,
      building Problems and Solutions from the first-principles output.

      Inputs: explore_digest (node:explore) + principles_output
      (node:first-principles) — Problems derive from the assumption–fact gap
      (Step 2 table), Solutions rebuild from atomic components (Step 3–4);
      never echo conventions without first-principles grounding. Scope and
      report contract from the launch args (passed by the framework's router
      node via graph_start): scope, focus, report_path, report_input — never
      re-detected, never re-interviewed.

      Report skeleton — binding, fixed order, never drop a section:
      §1 Explore evidence — explore_digest friction points / candidate
      areas, evidence-cited.
      §2 First-principles analysis — principles_output verbatim:
      assumption list → law-vs-convention table with evidence → atomic
      components → rebuilt design.
      §3 Candidates — Problems/Solutions from the assumption–fact gap
      (Step 2 table), findings cards, Top recommendation, Decision Request.
      Pre-output verify: the written report SHALL contain all three
      sections with upstream content; missing/incomplete → rewrite in
      place, re-verify; never report the node with §2 absent.

      report_input fresh → write markdown (NOT HTML) report at report_path.
      report_input fresh AND report_path exists (round ≥ 2) OR existing →
      re-review: read report at report_path (single source of truth — NO path re-confirmation),
      mark implementation progress per Top Rec item
      (evidence-backed), review defects (findings cards), update report in
      place (condense implemented content, rewrite Top Rec), increment round
      marker.

      Findings cards: Files / Problem / Solution / Benefits (locality +
      leverage + testability) / Recommendation strength (Strong | Worth
      exploring | Speculative). End with Top recommendation + Decision Request
      (Context, Auto-recorded debt, Blocking findings, Dispatch record,
      Suggested advance label).

      Open Recommendations block maintenance: update the report tail's
      Open Recommendations block every round — adopted/declined entries
      leave the pending list (marked adopted/declined), implemented
      entries are marked implemented, and a Top Recommendation that is not
      immediately adopted is added as pending. Fresh report → empty block.

      Output contract: report_path, round, implemented, new_findings, top_rec,
      top_rec_remaining, summary.
