name: openspec-pipeline
phases:
  # Stage 1: Raw idea entry — grill-with-docs (two-track shared entry)
  - id: grill
    type: flow
    use: grill-with-docs
    dependsOn: []

  # Stage 2: Spec creation — openspec-create (input-source detection + ADR judgment in interview)
  - id: create
    type: flow
    use: openspec-create
    dependsOn: [grill]
    channels:
      - node:grill/grilling

  # Stage 3: Track decision — the ONLY branch-route scenario (route-first):
  # the approval declares the two tracks; the AI recommends the one matching
  # the ADR judgment (adr_created), auto mode executes it. Revise/restart are
  # AI-generated dynamic options, not written.
  - id: pipeline-accept
    type: approval
    dependsOn: [create]
    task: |
      Spec quality gate

      openspec-create generated the delta spec. Track recommendation follows
      the ADR judgment: no ADR → minimal track (apply directly); ADR created →
      detailed track (engineer). Accept executes the recommendation; free input
      overrides; dynamic options include revise (re-run create) and restart
      (re-grill from the idea).
    routing:
      actions:
        - action: continue
          target: minimal-track
          value: minimal-track
          label: 'Minimal track — apply directly'
          description: 'No ADR created — implement the change without engineering ceremony'
        - action: continue
          target: detailed-track
          value: detailed-track
          label: 'Detailed track — engineer'
          description: 'ADR created — full spec-to-tickets engineering pipeline'

  # Branch routes — declared on the flows (route-first: routes are explicit).
  - id: minimal-track
    type: flow
    use: openspec-apply
    route: minimal-track
    dependsOn: [pipeline-accept]

  - id: detailed-track
    type: flow
    use: openspec-engineer
    route: detailed-track
    dependsOn: [pipeline-accept]

  # Stage 4: Terminal — any-join over the two tracks: the chosen track's
  # terminal satisfies the join; the unselected track never completes and
  # never blocks (route-first — no vacuous satisfaction).
  - id: pipeline-done
    type: main
    dependsOn: [minimal-track, detailed-track]
    join: any
    channels:
      - node:grill/grilling
      - node:create/spec-generate
      - node:minimal-track/archive
      - node:detailed-track/openspec-archive
    task: |
      Pipeline complete. Track: see upstream flow status. ADR: see create output (injected).
      Output: track (minimal | detailed | none), adr_created, change_name,
      candidates (echo from spec-generate when blocked), decisions (echo from grill).
      Incomplete judgment check: if spec_status is ok but adr_created is missing from
      spec-generate output (create gate bound exhausted) — output judgment_incomplete: true
      and suggest graph_jump back to create; never present the run as a completed implementation.
      Archive echo: read minimal-track/archive and detailed-track/openspec-archive outputs
      (node: channels, injected) — output archive_succeeded: true when either shows
      archive_status: success (downstream doc-maintenance when guard consumes it).

  # Stage 5: Document maintenance — trigger-first flow after archive
  # (spec-archive trigger; when guard = archive succeeded per pipeline-done echo).
  - id: doc-maintenance
    type: flow
    use: doc-update
    dependsOn: [pipeline-done]
    task: |
      Case-5 self-judgment: if pipeline-done output (injected) does not show
      archive_succeeded: true, this flow has NO WORK — finish with an empty
      declaration and no artifact; this is normal execution, not a skip.
      Otherwise the post-archive maintenance runs — doc-update's doc-trigger
      classifies the spec-archive trigger; scope_hints carry the change name.
