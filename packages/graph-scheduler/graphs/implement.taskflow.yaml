name: implement
phases:
  # Stage 1: Work input — resolve input source (openspec-change / tickets / prd / blocked)
  - id: work-input
    type: main
    dependsOn: []
    task: |

      Resolve work input and detect input source — NEVER ask the user.

      Detection order (mirrors openspec-create spec-scope three-source pattern):
      1. {args.changeName} provided → input_source: openspec-change, change_name set.
      2. Upstream plan/ticket output declares change_name (composition via plan-generate passes it) → openspec-change.
      3. {args.source: openspec} → run `openspec list --json`; exactly one active change → openspec-change
         (multiple or zero → input_source: blocked + candidate list, no guessing).
      4. Otherwise → input_source: tickets|prd ({args.ticket_paths} / {args.prd_path} / upstream output).

      Pre-agree implementation seams with tdd discipline (record in work_ref).
      Input source determines tail behavior — openspec-finalize's case-5
      self-judgment reads this output.

      Output (main agent collects):
        - input_source: openspec-change | tickets | prd | blocked
        - change_name: <name when openspec-change>
        - work_ref: <artifact or spec/ticket reference>
        - seams: [<pre-agreed tdd seams>]
        - ticket_paths: [paths when tickets]
        - prd_path: <path when prd>

  # Stage 2: Implement — tdd slices per implement graph mode
  - id: implement
    type: main
    skill: implement
    agent: [task, general]
    dependsOn: [work-input]
    task: |
      Execute implement graph mode — seam confirmation (question once), tdd red-green slices,
      regular typecheck + single-file tests, full suite at the end.

      When input_source: openspec-change — implement against `openspec instructions apply --json`
      (contextFiles + task progress); task completion stays in sync with code
      (ledger check-off happens uniformly in openspec-finalize, not forced here).
      When input_source: blocked — report candidate list and stop, implement nothing.

      Output (main agent collects):
        - diff_summary: <summary of implementation changes>
        - changed_files: [paths]
        - progress_note: <openspec task progress when change input>

  # Stage 3: Review — dual-axis audit per code-review
  - id: implement-review
    type: main
    skill: code-review
    agent: [reviewer, explore, task, general]
    dependsOn: [implement]
    channels:
      - skill:atom-graph-spec
    task: |
      Dual-axis review of the implementation per code-review (use ## Agent hints for axis sub-agents).

      Artifact set: work_ref + diff from implement output (injected); delta specs when change input
      (openspec/changes/<change_name>/specs/**).
      Standards: repo-documented coding standards — auto-discovered per code-review §3; atom-graph-spec
      (injected) for graph definitions.
      Spec: input-source contract — openspec-change → every SHALL in delta specs implemented;
      tickets/prd → PRD/ticket acceptance criteria met. Graph-definition hygiene — gate branch conditions
      bounded by target retryCount, branch targets are writer nodes, branch conditions reference
      contract fields / decision values, channels explicit.

      Output structured YAML report — overall: pass | fail, per-violation findings. Write report (main agent collects).

  # Stage 4: Gate — bounded backward rework on FAIL (route-first: pure backward jump)
  - id: implement-gate
    type: gate
    dependsOn: [implement-review]
    jumps:
      - when: 'implement-review output shows overall: fail AND implement retryCount < 2'
        to: implement

  # Stage 5: Accept — decision confirmation (route-first: no written actions).
  # Recommendation follows the review verdict; revise/redo-input are AI-generated
  # dynamic options, not written.
  - id: implement-accept
    type: approval
    dependsOn: [implement-gate]
    channels:
      - node:implement-review
    task: |
      Accept the implementation?

      implement-review reported the dual-axis verdict. Recommendation follows the
      review verdict and the rework bound: accept when the implementation passes
      (finalize follows when the input is an OpenSpec change); otherwise revise
      (re-run implement with review feedback) or redo from input (re-resolve the
      work input).

  # Stage 6: OpenSpec finalize — reverse-validated archive (case-5 self-judgment
  # on change input: unconditional run, no-work declared when input is not change-bound)
  - id: openspec-finalize
    type: main
    skill: atom-openspec-archive
    dependsOn: [implement-accept]
    channels:
      - node:work-input
    task: |
      Case-5 self-judgment: if work-input output (injected channel) does not show
      input_source: openspec-change, this node has NO WORK — output
      archive_status: none and finish; this is normal execution, not a skip.

      Execute atom-openspec-archive flow (reverse-validated archive).

      Read implement-accept output (injected via dependsOn implicit context) — the
      accept decision confirms the implementation passed review; the input source
      comes from work-input (node:work-input channel, case-5 judgment above).
      Change name: from work-input output change_name field (injected via node:work-input channel) — NEVER ask;
      skill Step 0 `openspec list` fallback only when name absent (this graph has no apply-change upstream).
      Step 0 reverse-validation: task completion × code evidence (grep, contextFiles + implementation output);
        evidence hit → check off ledger + register verification.md; checked without evidence → drift →
        refuse archive + rework suggestion output.
      Step 1-3: `openspec archive <change> --yes --json` (CLI inlines delta specs → main specs sync).

      Write output (main agent collects):
        - archive_status: success | failed | blocked | none
        - change_name: <name>
        - validation_result: pass | fail | warn
        - message: <summary>
