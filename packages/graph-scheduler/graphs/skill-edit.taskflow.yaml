name: skill-edit
version: 1
phases:
  - id: skill-select
    type: main
    dependsOn: []
    task: |
      Load skill://atom-kernel. Conduct consensus interview per atom-kernel §interview() behavior contract to confirm edit target.

      1. Accept skill path or name from user input.
      2. Load existing SKILL.md — read frontmatter + body structure.
      3. Present current state to user: name, description, sections.
      4. Confirm: "This is the skill you want to edit?"
      5. Write target to .taskflow/outputs/skill-select.output.txt:
        - skill_path: <path>
        - skill_name: <name>
        - current_frontmatter: <summary>
        - current_sections: [list]

  - id: edit-scope-confirm
    type: main
    dependsOn: [skill-select]
    task: |
      Load skill://atom-kernel. Conduct consensus interview per atom-kernel §interview() behavior contract to confirm edit scope.

      Read current skill state from skill-select output.
      Interview:
      - What to change: description, trigger phrases, body sections, remove sections?
      - Scope of each change: full rewrite or incremental?
      - Any new skill:// dependencies to add or remove?
      - DDD impact: does this change affect domain concepts?
      Assess plan completeness:
      - Plan is "complete" if all changes specified
      - Mark plan_complete: true/false, ddd_needed: true/false
      Write to .taskflow/outputs/edit-scope-confirm.output.txt:
        - plan_complete: true/false
        - ddd_needed: true/false
        - changes: [list of change descriptions]
        - dependencies: [skill:// refs to add/remove]
        - trigger_phrases: [updates]

  - id: edit-analysis
    type: agent
    dependsOn: [edit-scope-confirm]
    when: 'edit-scope-confirm output shows plan_complete: false — plan incomplete, further analysis needed'
    task: |
      Analyze edit requirements based on edit-scope-confirm output.

      Read scope from .taskflow/outputs/edit-scope-confirm.output.txt.
      Read current skill state from .taskflow/outputs/skill-select.output.txt.
      Complete the plan:
      - Produce detailed diff plan — what lines change, what sections restructure
      - Specify frontmatter changes — fields to add, update, remove
      - Specify body changes — sections to add, update, remove, reorder
      - Map DDD impact if ddd_needed is true
      Write completed diff plan to .taskflow/outputs/edit-analysis.output.txt.
    context:
      - .taskflow/outputs/edit-scope-confirm.output.txt
      - .taskflow/outputs/skill-select.output.txt

  - id: plan-confirm
    type: main
    dependsOn: [edit-scope-confirm, edit-analysis]
    when: 'edit-analysis was executed — need to confirm analysis results'
    task: |
      Load skill://atom-kernel. Conduct consensus interview per atom-kernel §interview() behavior contract to confirm edit plan.

      Read diff plan from .taskflow/outputs/edit-analysis.output.txt.
      Present plan to user — confirm each point per interview() behavior contract:
      - Body section changes
      - Dependency changes
      - DDD impact (if applicable)
      Confirm or revise.
      Write confirmed plan to .taskflow/outputs/plan-confirm.output.txt.

  - id: ddd-update
    type: agent
    dependsOn: [plan-confirm]
    when: 'edit-scope-confirm output shows ddd_needed: true — DDD documents need updating'
    task: |
      Update DDD documents based on confirmed edit plan.

      Read plan from .taskflow/outputs/plan-confirm.output.txt.
      Read scope from .taskflow/outputs/edit-scope-confirm.output.txt.
      Identify domain concept changes introduced by edit.
      Update relevant domain docs (graph-builtin or graph-workflow).
      Write change summary to .taskflow/outputs/ddd-update.output.txt.
    context:
      - .taskflow/outputs/edit-scope-confirm.output.txt
      - .taskflow/outputs/plan-confirm.output.txt
      - docs/domains/

  - id: skill-edit-write
    type: agent
    dependsOn: [ddd-update]
    skill: atom-skill-edit
    task: |
      Modify SKILL.md per confirmed diff plan.

      Read current skill from skill-select output.
      Read edit plan from plan-confirm output.
      Load skill://atom-skill-writer for compliance rules.
      Perform in-place edits — frontmatter changes, section updates, section removals.
      Validate modified skill against every atom-skill-writer rule.
      Write modified SKILL.md (overwrite existing — backup original).
      Write before/after diff to .taskflow/outputs/skill-edit-write.output.txt.
    context:
      - .taskflow/outputs/skill-select.output.txt
      - .taskflow/outputs/edit-scope-confirm.output.txt
      - .taskflow/outputs/plan-confirm.output.txt
      - .taskflow/outputs/ddd-update.output.txt
  - id: skill-review
    type: agent
    dependsOn: [skill-edit-write]
    skill: atom-dual-review
    task: |
      Review modified SKILL.md for compliance and completeness.

      Artifact: SKILL.md path from skill-edit-write output. Locate path in .taskflow/outputs/skill-edit-write.output.txt.
      Standards: packages/graph-workflow/skills/atom-skill-writer/SKILL.md — 15 structural rules (frontmatter×6 + body×5 + language×2 + reference×2).
      Spec: .taskflow/outputs/plan-confirm.output.txt — check skill matches confirmed diff plan.

      Read all three files. Execute 6-step linear flow: Read Artifact → Load Standards → Load Spec → Standards Audit (check every rule: pass/violation/warning) → Spec Audit (check every requirement: pass/violation/not_applicable) → Output structured YAML report.

      Pay special attention to:
      - Frontmatter consistency after edit
      - Section structure integrity
      - No orphan references from removed sections

      Output machine-parseable YAML with overall: pass | fail. Write to .taskflow/outputs/skill-review.output.txt.
    context:
      - .taskflow/outputs/skill-edit-write.output.txt
      - .taskflow/outputs/plan-confirm.output.txt
      - packages/graph-workflow/skills/atom-skill-writer/SKILL.md

  - id: edit-accept
    type: approval
    dependsOn: [skill-review]
    routing:
      actions:
        - action: continue
          label: 'Accept edit'
          description: 'Modified skill is ready — proceed to output diff'
        - action: retry
          label: 'Revise edit'
          description: 'Skill needs changes — re-run skill-edit-write with review feedback'
        - action: jump
          label: 'Revise plan'
          description: 'Fundamental plan issues — re-confirm scope'
    context:
      - .taskflow/outputs/skill-review.output.txt

  - id: output-diff
    type: main
    dependsOn: [edit-accept]
    task: |
      Generate before/after diff for user review.

      Read original skill from .taskflow/outputs/skill-select.output.txt.
      Read modified skill path from .taskflow/outputs/skill-edit-write.output.txt.
      Read review report from .taskflow/outputs/skill-review.output.txt.
      Produce diff summary: changed sections, added lines, removed lines, validation result.
      Write to .taskflow/outputs/output-diff.output.txt.
    context:
      - .taskflow/outputs/skill-select.output.txt
      - .taskflow/outputs/skill-edit-write.output.txt
      - .taskflow/outputs/skill-review.output.txt
