name: openspec-engineer
phases:
  # Spec — synthesize from the recorded ADR decision + change context.
  - id: to-spec
    type: main
    dependsOn: []
    operations: [read, write, run]
    task: |
      Synthesize the spec from the recorded ADR decision + change context per
      to-spec skill. No interview. Change name — NEVER ask: {args.changeName}
      → openspec list --json single active → spec_status: blocked + candidates.
      Sketch seams (prefer existing, highest); seam confirmation via
      approval() — per to-spec skill (auto mode auto-confirms).
      Write spec per to-spec template; publish to tracker with ready-for-agent
      label (none configured → docs/specs/).

      Output contract: spec_path, spec_status (published | blocked),
      seam_summary, change_name, adr_path.

  # Tickets — split the spec into tracer-bullet slices.
  - id: to-tickets
    type: main
    dependsOn: [to-spec]
    operations: [read, write, run]
    task: |
      Break the spec into tracer-bullet tickets per to-tickets skill.
      Draft vertical slices with blocking edges; breakdown confirmation via
      approval() — per to-tickets skill (auto mode auto-approves); publish
      in dependency order (local files when no tracker).

      Output contract: ticket_count, ticket_paths, change_name (echo).

  # Implement — tdd slices per implement skill (graph-mode patched).
  - id: implement
    type: main
    skill: implement
    dependsOn: [to-tickets]
    operations: [read, write, run, verify]
    channels:
      - node:implement-review
      - node:to-spec
    task: |
      Execute implement graph mode per implement skill. Read to-spec
      output — seams come from seam_summary (already approved via
      approval() — no re-confirmation); tdd red-green slices in frontier
      order, regular
      typecheck + single-file tests, full suite at the end. Re-run rounds:
      fix every implement-review finding FIRST, then continue.

      Main-spec single writer: never edit openspec/specs/** main spec
      files during implementation; openspec archive is the sole
      spec-sync channel.

      Spec standards per affected domain — deterministic mapping rule:
      graph → atom-graph-spec, skill → atom-skill-spec, doc →
      atom-doc-maintain. Determine the change's affected files (delta
      spec domains / openspec instructions apply contextFiles), load each
      corresponding spec skill BEFORE writing, and validate the
      implementation against its rule classes (deterministic rules →
      validation errors, heuristic rules → warnings) while writing.

      Output contract: diff_summary, changed_files, progress_note,
      verification_path (the change's verification document path — derived
      from change_name, e.g. openspec/changes/<change>/verification.md).

  # Review — dual-axis audit (spec + tickets + ADR contract).
  - id: implement-review
    type: main
    skill: code-review
    agent: [reviewer, explore, task, general]
    dependsOn: [implement]
    operations: [locate, read, review]
    channels:
      - node:to-spec
      - node:to-tickets
    task: |
      Dual-axis review of the implementation per code-review (use ## Agent
      hints for axis sub-agents). Artifacts: spec (to-spec), tickets
      (to-tickets), diff (implement), recorded ADR — implementation must
      honor the decision. Spec: ticket acceptance criteria met; ADR honored.

      Spec standards per affected domain — deterministic mapping rule:
      graph → atom-graph-spec, skill → atom-skill-spec, doc →
      atom-doc-maintain. Determine the change's affected files, load each
      corresponding spec skill, validate the implementation against its rule
      classes (deterministic rules → validation errors, heuristic rules →
      warnings) + repo coding standards.

      Output contract: report (structured YAML, overall: pass | fail).

  # Gate — bounded rework on FAIL (backward jump to implement).
  - id: implement-gate
    type: gate
    dependsOn: [implement-review]
    jumps:
      - when: 'implement-review output shows overall: fail AND implement retryCount < 2'
        to: implement

  # Accept — decision confirmation.
  - id: implement-accept
    type: approval
    dependsOn: [implement-gate]
    channels:
      - node:implement-review
    task: |
      Implementation approval

      Decision: accept when the implementation passes review (reverse-
      validated archive follows); revise/redo spec otherwise.
  # Closure — lifecycle closure: reverse-validated archive + ADR
  # decision-fold + index rebuild in one unit (detailed track).
  - id: openspec-archive
    type: main
    dependsOn: [implement-accept]
    skill: atom-doc-lifecycle
    operations: [read, run, archive]
    channels:
      - node:to-spec
      - node:implement
    task: |
      Execute atom-doc-lifecycle close(): reverse-validate task completion
      against code evidence → archive → fold ADRs (adr_created: to-spec
      adr_path present → true; supersedes from the change's ADR metadata) →
      rebuild index → lifecycle validation. Change name: to-spec output
      change_name (echo). Verification document: node:implement
      verification_path field — tasks consume fields, never file globs.

      Output contract: archive_status (success | failed | blocked),
      change_name, adr_changes, index_rebuilt, validation, message.
