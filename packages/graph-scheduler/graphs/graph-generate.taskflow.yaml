name: graph-generate
phases:
  - id: scope-confirm
    type: main
    dependsOn: []
    skill: atom-scope-interview
    channels:
      - ./CONTEXT.md
    task: |
      Execute scope interview per atom-scope-interview.

      Topics: graph name and purpose; scope (start-to-end phases, user interactions, agent tasks); skill dependencies (entry skills for main phases); dependencies (other graphs or skills to reference); save location.

      Output: confirmed graph name and purpose, full phase topology (ids, types, dependsOn edges, gate branches, join modes, channels), skill dependencies, scope_complete: true, save_location.

  - id: graph-design
    type: main
    dependsOn: [scope-confirm]
    skill: atom-graph-design
    channels:
      - skill:atom-graph-spec
    task: |
      Design graph topology using atom-kernel interview() solve mode — confirm goal → research specs → think topology → interview decisions → repeat until confirmed.

      Read scope-confirm output (injected).

      Execute interview({ goal: "design graph topology for confirmed scope", research: true, context }) per atom-kernel §interview() solve mode:

      confirm(goal): Confirm design goal with user via interview(). Confirm graph name, purpose, phase count estimate, flow-type sub-graph calls, save location. Never skip — goal consensus required.

      research: Load atom-graph-spec. Look up PhaseSchema fields, topology constraints (acyclic, minimal deps, single entry), gate branch rules (natural-language conditions referencing observable facts), flow phase constraints (use/def, depth cap), approval routing patterns. Scan existing graphs for patterns.

      think: Design complete phase topology — ids (kebab-case), types (main/approval/flow), dependsOn edges (DAG, no cycles), gate branches (conditions referencing upstream outputs / decision values), join modes (all/any), channels. Validate per atom-graph-spec §Topology Constraints: no cycles, all reachable, branch conditions observable, flow phases have use or def.

      interview(details): Present design decisions one at a time via question() — graph name, phase count/types, dependsOn edges, gate branches, approval routing. Recommendation first. User rejects → return to think, revise, re-interview affected decisions only.

      Output: When all confirmed, write design (main agent collects) per atom-graph-design output format.

  - id: graph-write
    type: main
    dependsOn: [graph-design]
    skill: atom-graph-writer
    task: |
      Generate valid .taskflow.yaml from graph design.

      Read graph-design output (injected).
      Read scope-confirm output (injected).
      Generate complete .taskflow.yaml per atom-graph-spec format rules:
      - Top-level name/version/phases
      - Block scalar | for task fields
      - Flow sequences for dependsOn
      - Block sequences for channels
      - routing.actions for approval phases
      Validate against PhaseSchema constraints.
      Write .taskflow.yaml to path specified in scope-confirm output.
      Write output path and summary (main agent collects).
    channels:
      - node:scope-confirm
      - skill:atom-graph-spec

  - id: graph-review
    type: main
    dependsOn: [graph-write]
    skill: code-review
    agent: [reviewer, task]
    task: |
      Review generated .taskflow.yaml per code-review (use ## Agent hints for axis sub-agents).

      Artifact: graph-write output (injected); graph-design + scope-confirm outputs (injected).
      Standards: atom-graph-spec (injected) — schema compliance, topology safety, branch condition observability, join mode validity.
      Spec: graph matches design — same topology, same branches, same types.

      Output structured YAML report with overall: pass | fail. Write report (main agent collects).
    channels:
      - node:graph-design
      - node:scope-confirm
      - skill:atom-graph-spec

  # Gate — bounded backward rework on FAIL (route-first: pure backward jump)
  - id: graph-gate
    type: gate
    dependsOn: [graph-review]
    jumps:
      - when: 'graph-review output shows overall: fail AND graph-write retryCount < 2'
        to: graph-write

  # Accept — decision confirmation (route-first: no written actions).
  # Recommendation follows the review verdict; revise/redesign are AI-generated
  # dynamic options, not written.
  - id: graph-accept
    type: approval
    dependsOn: [graph-gate]
    channels:
      - node:graph-review
    task: |
      Accept the graph?

      graph-review reported the graph definition review verdict. Recommendation
      follows the review verdict and the rework bound: accept when the graph
      passes (usage examples follow); otherwise revise (re-run graph-write with
      review feedback) or redesign (re-run graph-design).

  - id: output-examples
    type: main
    dependsOn: [graph-accept]
    task: |
      Generate usage examples for the new graph.

      Read graph-write / graph-review upstream output files.
      Produce 2-3 concrete invocation examples:
      - How to start the graph (graph_start payload)
      - Expected phase flow (which phases run in what order)
      - Sample approval decision
      Write examples (main agent collects).
