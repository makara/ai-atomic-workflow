name: graph-generate
# Maker journey — produces .taskflow.yaml graphs (name states the operation).
description: Maker journey — produces .taskflow.yaml graph artifacts for end-user projects.
# Graph-level ambient context — phases consume atom-graph-spec without
# per-node declaration; entry skips its own CONTEXT.md declaration (project
# glossary via config default layer). CONTEXT.md also satisfies the
# atom-scope-interview contract coverage statically.
context:
  - skill:atom-graph-spec
  - ./CONTEXT.md
phases:
  # Maker journey — concrete graph production (single kind=graph, single
  # operation=create). No skeleton, no kind switch, no skill co-production.
  - id: entry
    type: main
    dependsOn: []
    skill: atom-scope-interview
    task: |
      Execute scope interview per atom-scope-interview (maker journey —
      kind=graph, operation=create; no kind switch, no skill co-production).

      Mandatory confirmation — SHALL run on EVERY activation: confirm graph
      name, topology scope (purpose, phases, skill dependencies), save
      location (default .graph-scheduler/graphs/). NEVER auto-skip.

      Foreign-project degradation: ./CONTEXT.md may be absent (end-user
      project without the repo domain glossary) — skip the domain-model
      lookup and interview scope directly; absence is NOT a failure.

      Output contract: graph_name, scope, save_location, scope_complete.

  # Spec — design the phase topology per atom-graph-design (solve mode);
  # the skill contract derives the atom-graph-spec reference channel.
  - id: spec
    type: main
    dependsOn: [entry]
    skill: atom-graph-design
    task: |
      Execute atom-graph-design graph mode per atom-graph-design skill —
      entry scope is the design input; interview solve mode, present design
      decisions one at a time.

      Output contract: design, graph_name (echo), save_location (echo),
      scope_complete (echo).

  # Spec accept — design confirmed before any write (spec-first).
  - id: spec-accept
    type: approval
    dependsOn: [spec]
    channels:
      - node:spec
    task: |
      Accept the graph design?

      Decision: design per atom-graph-spec — accept when complete; revise
      otherwise.

  # Implement — write artifact + registry entry + attached doc (one write
  # node = one rework target).
  - id: implement
    type: main
    dependsOn: [spec-accept]
    skill: atom-graph-writer
    channels:
      - node:spec
      - node:entry
    task: |
      Execute atom-graph-writer graph mode per atom-graph-writer skill —
      produce the graph artifact per the confirmed design + atom-graph-spec.

      Three-path bundle (project convention, writer skill cannot know it):
      graph file at .graph-scheduler/graphs/<name>.taskflow.yaml (default
      save_location), registry entry in .graph-scheduler/graphs/registry.json,
      attached usage doc at .graph-scheduler/docs/<name>.md.

      Load-probe validation: graph_start the produced graph → expect a node
      return + 0 contractWarnings → then graph_force_end the probe run.
      Report the probe result; deviations from design SHALL be reported, not
      negotiated.

      Output contract: artifact_path, registry_path, doc_path, validation
      (passed | failed + details), graph_name (echo), summary.

  # Review — kind standards injected; one review phase.
  - id: review
    type: main
    dependsOn: [implement]
    skill: code-review
    agent: [reviewer, explore, task, general]
    channels:
      - node:entry
      - node:spec
    task: |
      Review the produced graph per code-review (use ## Agent hints for
      axis sub-agents; forward the injected ## Reference blocks — axis
      agents SHALL NOT re-discover atom-graph-spec). Standards:
      atom-graph-spec (graph definitions) + repo-documented coding
      standards. Spec: artifact matches the confirmed design.

      Output contract: report (machine-parseable YAML, overall:
      pass | fail).

  # Gate — bounded rework on FAIL (backward jump to implement).
  - id: gate
    type: gate
    dependsOn: [review]
    jumps:
      - when: 'review output shows overall: fail AND implement retryCount < 2'
        to: implement

  # Accept — final artifact approval.
  - id: accept
    type: approval
    dependsOn: [gate]
    channels:
      - node:review
    task: |
      Accept the graph?

      Decision: accept when the artifact passes review; revise/redesign
      otherwise.
