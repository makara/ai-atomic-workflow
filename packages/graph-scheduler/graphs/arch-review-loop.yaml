name: arch-review-loop
$schema: ../schemas/workflow.schema.json
version: 1.0.0
# Node overview table (atom inventory). Bounded compound
# goals: connectors AND/THEN/IF-ELSE/OR — structural keywords ALL-CAPS
# (AND/OR/IF/THEN/ELSE), prose and/or lowercase, ≤ 5 steps, gates ≤ 3 AND/OR
# operands (retryCount bound not counted), conditional paths ≤ 3. Entry
# shape { id, type, goal, constraints? } — goal states the atom's intent;
# mechanism lives in the goal (flow entries state "expands <use>
# subgraph"). constraints: one-sentence prose rules — general boundaries +
# explicit non-goals, ≤ 5 per atom, never machine-validated. User-maintained.
inventory:
  - id: requirement
    type: flow
    goal: Expands arch-review subgraph
    constraints:
      - composition only — child rules live in the subgraph
  - id: round-continue
    type: approval
    goal: Proceed IF a Top Recommendation remains, ELSE end the run
    constraints:
      - routes only — never re-runs the requirement phase
  - id: adopt
    type: flow
    goal: Expands adopt-with-docs subgraph
    constraints:
      - composition only — child rules live in the subgraph
  - id: implement
    type: flow
    goal: Expands spec-implement subgraph
    constraints:
      - composition only — child rules live in the subgraph
  - id: loop-gate
    type: gate
    goal: Jump back to scope-entry IF a Top Recommendation remains AND retry bound is not reached
    constraints:
      - machine judgment only — never decides beyond declared jump conditions
  - id: loop-accept
    type: approval
    goal: Loop again IF re-review is needed, ELSE complete the run
    constraints:
      - routes only — never edits the report
# Global channel — the review report stream is promoted into ambient context:
# every decision/gate phase of the loop (round-continue, adopt, loop-gate,
# loop-accept) reads it without per-phase declaration. The owning node skips
# its own promoted stream.
context:
  - node:requirement/present-candidates
phases:
  # Three-stage loop: requirement (arch-review) → round-continue content gate →
  # adopt (adopt-with-docs) + implement (spec-implement) on the proceed route;
  # single loop-gate back to scope-entry.
  - id: requirement
    type: flow
    use: arch-review
    dependsOn: []

  # Content gate — branch-route decision: continue activates the proceed route
  # (adopt + implement); end completes the run. Empty rounds (no Top
  # Recommendation) end here — proceed members never activate.
  - id: round-continue
    type: approval
    dependsOn: [requirement]
    routing:
      actions:
        - action: continue
          target: proceed
          value: continue
          label: Continue — adopt + implement the Top Recommendation
          description: Top Recommendation remains — proceed through adopt and implement
        - action: end
          value: end
          label: End — nothing remains
          description: No Top Recommendation — finish the loop here
    task: |
      Proceed with the round?

      Recommendation: continue when the review reports a remaining Top
      Recommendation (top_rec_remaining: true — branchTo proceed activates
      adopt + implement); end when nothing remains (end action completes the
      run — auto mode ends automatically).

  # Adopt — report as input document (inherited via graph-level channels).
  # Route: proceed — activated only by round-continue continue.
  - id: adopt
    type: flow
    use: adopt-with-docs
    dependsOn: [requirement]
    route: proceed

  # Implement — produced change + adoption record as input; reads declared on
  # spec-implement's entry (spec-extract) — composition read edges, no flow
  # channels (two-scope context model).
  # Route: proceed — activated only by round-continue continue.
  - id: implement
    type: flow
    use: spec-implement
    dependsOn: [adopt]
    route: proceed

  # Loop gate — top Rec remains + bound → re-round from scope-entry. Pure
  # machine judgment — run mode plays no part (consumption boundary).
  - id: loop-gate
    type: gate
    dependsOn: [implement]
    jumps:
      - when: 'requirement/present-candidates output shows top_rec_remaining: true AND requirement/scope-entry retryCount < 8'
        to: requirement/scope-entry

  # Round-end — loop again (Top Rec remains + bound) or complete.
  - id: loop-accept
    type: approval
    dependsOn: [loop-gate]
    task: |
      End the review loop?

      Decision: Loop again — re-run from requirement/scope-entry (scope +
      report input re-confirmed). Complete — loop finishes.
