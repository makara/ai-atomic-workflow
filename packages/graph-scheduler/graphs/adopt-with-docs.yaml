name: adopt-with-docs
description: 'Non-interactive adoption spec-production graph — self-deciding openspec-propose pipeline consuming the framework-hosted adoption consensus via graph_start args.'
$schema: ../schemas/workflow.schema.json
version: 1.0.0
interaction: none
flow:
  - 'spec-propose --> __handoff'
inventory:
  - id: spec-propose
    type: main
    goal: Executes openspec-propose to create the change with proposal, specs, design and tasks
    constraints:
      - planning only — never edits project code
      - never guesses the change name — blocked + candidates instead
      - consumes the adoption consensus from the composing framework graph via channels — never re-conducts the conversation
context:
  - skill:domain-modeling
phases:
  - id: spec-propose
    type: main
    dependsOn: []
    skill: openspec-propose
    operations: [read, write, run]
    task: |
      Generate delta spec change per the upstream openspec-propose skill.

      Change name from the framework-hosted adoption consensus — the
      launching router passes the change name + scope + ADR judgment +
      decisions via graph_start args ({args.changeName} / {args.adrCreated}
      / {args.decisions}); change exists → update the existing change in
      place (no duplicates).
      Change name resolution — per the single source
      (task-templates/contracts.ts CHANGE_NAME_RESOLUTION_RULE); never
      re-encode the rule body here.
      Material ambiguity not resolved by the adoption consensus → record
      reasonable assumptions in the planning artifacts per the skill
      guardrails. Delta authoring: read the target main spec's requirement
      names before writing specs/<capability-path>/spec.md; MODIFIED
      references an existing requirement name as-read — never an
      invented name; ADDED/REMOVED describe genuine additions/removals
      relative to the main spec as-read. Echo adr_created + decisions
      (track gate + workflow-done consume).

      No-content rule: the framework-hosted adoption scope reports nothing
      to adopt → append NO adoption record (no appendix section),
      change_name empty, adr_created false — zero side effects.

      Output contract: change_name, domains, file_paths, validation_result,
      spec_status, adr_created (echo), decisions (echo).
