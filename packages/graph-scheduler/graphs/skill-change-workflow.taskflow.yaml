name: skill-change-workflow
phases:
  # Stage 1: Plan — delegates to plan-generate (scope -> PRD -> optional tickets)
  - id: plan
    type: flow
    use: plan-generate
    dependsOn: []

  # Stage 1b: Parse PRD — extract skill-specific metadata for writer self-judgment
  - id: plan-parse
    type: main
    dependsOn: [plan]
    task: |
      Read PRD from plan output. Extract skill-domain metadata.

      1. Read PRD at prd_path from plan output (injected via dependsOn implicit context).
      2. Extract skill-specific metadata from PRD content:
        - skill_create_needed: true if User Stories describe new skill authoring
        - skill_create_name: <skill name if create>
        - skill_delete_needed: true if Implementation Decisions reference skill deletion
        - skill_delete_name: <skill name if delete>
        - doc_update_needed: true if any section mentions document updates beyond changed skill
        - doc_update_files: [list of doc paths]
        - spec_needed: true if any section mentions capability/spec changes (new or modified OpenSpec capabilities)
      Write output (main agent collects):
        - prd_path: <from plan output>
        - scope_complete: true
        - ticket_split_needed: <from plan output>
        - ticket_count: <from plan output, if ticket-split executed>
        - ticket_paths: <from plan output, if ticket-split executed>
        - skill_create_needed: true/false
        - skill_create_name: <skill name if create>
        - skill_delete_needed: true/false
        - skill_delete_name: <skill name if delete>
        - doc_update_needed: true/false
        - doc_update_files: [list of doc paths]
        - spec_needed: true/false
        - change_summary: <from plan output>

  # Stage 1c: Writer flows — branch-gate deleted (route-first: no forward
  # routing, no parallel branches). Each writer now runs unconditionally and
  # self-judges on its own plan-parse flag (case 5: no work when the flag is
  # absent — normal execution, not a skip).
  - id: skill-delete-foo
    type: flow
    use: skill-delete
    dependsOn: [plan-parse]
    task: |
      Case-5 self-judgment: if plan-parse output does not show
      skill_delete_needed: true, this flow has NO WORK — finish with an empty
      declaration (echo skill_delete_needed: false) and no artifact; this is
      normal execution, not a skip.

  - id: skill-author-foo
    type: flow
    use: skill-author
    dependsOn: [plan-parse]
    task: |
      Case-5 self-judgment: if plan-parse output does not show
      skill_create_needed: true, this flow has NO WORK — finish with an empty
      declaration (echo skill_create_needed: false) and no artifact; this is
      normal execution, not a skip.

  - id: doc-update
    type: flow
    use: doc-update
    dependsOn: [plan-parse]
    task: |
      Case-5 self-judgment: if plan-parse output does not show
      doc_update_needed: true, this flow has NO WORK — finish with an empty
      declaration (echo doc_update_needed: false) and no artifact; this is
      normal execution, not a skip.

  - id: openspec-create-foo
    type: flow
    use: openspec-create
    dependsOn: [plan-parse]
    task: |
      Case-5 self-judgment: if plan-parse output does not show spec_needed:
      true, this flow has NO WORK — finish with an empty declaration (echo
      spec_needed: false) and no artifact; this is normal execution, not a skip.

  # Stage 2: Cross review — inter-artifact consistency audit (all four writers
  # complete unconditionally; non-needed writers finish with empty outputs)
  - id: cross-review
    type: main
    skill: code-review
    agent: [reviewer, task]
    dependsOn: [skill-author-foo, skill-delete-foo, doc-update, openspec-create-foo]
    task: |
      Cross-artifact consistency review per code-review (use ## Agent hints for axis sub-agents).

      Artifact: PRD at prd_path + plan-parse output (injected); upstream artifacts auto-resolved from skill-author-foo, skill-delete-foo, doc-update, openspec-create-foo (a writer that self-judged no work produces no artifact — review only the artifacts that exist).
      Standards: per-artifact format — atom-skill-spec rules (skills), atom-graph-spec rules (graphs), Markdown structural checks (docs).
      Spec: cross-artifact consistency — plain-name skill references resolve; graph use:/skill: fields match registered names; doc links present in artifact set; no name collisions; scope matches PRD User Stories and Out of Scope.

      Output structured YAML report — overall: pass | fail, per-violation findings, cross-artifact conflicts. Write audit report (main agent collects).
    channels:
      - node:plan-parse
      - skill:atom-skill-spec
      - skill:atom-graph-spec

  # Stage 3: Approval — final quality gate (decision confirmation; per-writer
  # retry targets are AI-generated dynamic options — multi-writer graph, no
  # single rework point: no auto-rework).
  - id: change-accept
    type: approval
    dependsOn: [cross-review]
    task: |
      Accept the change?

      All flagged writers completed and cross-reviewed (code-review output).
      Recommendation follows the cross-review verdict and which writers
      actually produced artifacts; free input overrides. Dynamic options
      include revise (re-run the affected writer — skill-author-foo /
      skill-delete-foo / doc-update / openspec-create-foo) and revise plan
      (jump back to plan-generate).

  # Stage 4: Archive — finalize completed OpenSpec change
  - id: archive
    type: main
    skill: atom-openspec-archive
    dependsOn: [change-accept]
    task: |
      Archive the completed OpenSpec change via openspec archive CLI.

      Read change-accept output (injected via dependsOn implicit context).

      Execute per atom-openspec-archive flow:
      1. Determine change_name (NEVER ask): {args.changeName} if provided → `openspec list --json` filtered to complete changes (single entry) → else archive_status: blocked + candidates.
      2. Reverse-validate task completion against code evidence before archive.
      3. Run openspec archive CLI for the change.
      4. Verify archive result — change moved to archive, specs synced.

      Write output (main agent collects):
        - archive_status: success | failed | blocked
        - change_name: <change name>
        - validation_result: pass | fail | warn
        - message: <summary>
      Note: atom-openspec-archive declares upstream 'apply-change' — specific to the openspec-apply graph; this graph resolves the name via args/list fallback instead (skill Step 0).
