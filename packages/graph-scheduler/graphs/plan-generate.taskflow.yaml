name: plan-generate
phases:
  # Phase 1: Scope interview + to-spec PRD synthesis
  - id: scope-confirm
    type: main
    dependsOn: []
    skill: atom-scope-interview
    channels:
      - ./CONTEXT.md
    task: |
      Execute scope interview per atom-scope-interview.

      Topics: plan goal/problem; constraints (what must NOT change, limits); affected areas (domains, modules, artifacts).

      When scope_complete: true, run to-spec to synthesize PRD from interview findings. Publish to issue tracker. Save local copy for downstream phases. Do NOT prescribe section format or output path — to-spec owns its template and publishing conventions.

      Output: prd_path (derived from to-spec native output), scope_complete: true, ticket_split_needed (complex >=4 distinct operations or cross-domain -> true), change_summary.

  # Phase 2: Scope gate — machine completeness check (bounded auto-rework).
  # Both rework conditions share ONE bound: scope-confirm retryCount < 2 (JUMP
  # counter, never zeroed — route-first redesign). No match → pass through to
  # the human card at scope-accept (no forward routing).
  - id: scope-gate
    type: gate
    dependsOn: [scope-confirm]
    jumps:
      - when: 'scope-confirm output shows scope_complete: false or missing AND scope-confirm retryCount < 2'
        to: scope-confirm
      - when: 'scope-confirm output shows prd_path missing or PRD file absent or empty AND scope-confirm retryCount < 2'
        to: scope-confirm

  # Phase 3: PRD acceptance — decision confirmation (route-first: no written
  # actions; revise/re-plan options are AI-generated dynamic options).
  - id: scope-accept
    type: approval
    dependsOn: [scope-gate]
    channels:
      - node:scope-confirm
    task: |
      Accept the PRD plan?

      PRD synthesized (path confirmed at scope-confirm). Recommendation follows
      the scope-confirm output (scope_complete, prd_path, ticket_split_needed);
      free input overrides. Dynamic options include revise (re-run
      scope-confirm) and re-plan from start (jump back to scope-confirm).

  # Phase 4: Ticket split — case-5 self-judgment (was gated by ticket-gate's
  # forward branch on ticket_split_needed; the gate is deleted — this node now
  # runs unconditionally and self-judges).
  - id: ticket-split
    type: main
    dependsOn: [scope-accept]
    channels:
      - node:scope-confirm
    task: |
      Case-5 self-judgment: if scope-confirm output does not show
      ticket_split_needed: true (ticket split not required), this node has NO
      WORK — output ticket_count: 0, ticket_paths: [] and finish; this is
      normal execution, not a skip.

      Otherwise run to-tickets on the PRD. Accept its native output.

      1. Read PRD from scope-confirm output prd_path (injected via dependsOn implicit context).
      2. Run to-tickets — interview user to confirm split granularity, priority, blocking edges.
      3. Accept to-tickets native output files and naming convention (<NN>-<slug>.md).
      4. Write output (main agent collects):
        - ticket_count: <N>
        - ticket_paths: [list of ticket file paths — derived from to-tickets native output]
