name: skill-delete
phases:
  - id: skill-select
    type: main
    dependsOn: []
    task: |

      If plan-parse upstream provides skill_delete_name (injected when orchestrated):
        Use it directly — skip interview
      Else (standalone context):
        Conduct interview() to collect scope

      Conduct interview to confirm skill to delete.

      1. Search conversation for user-provided skill name or path.
      2. If ambiguous, ask clarifying questions via question() per atom-kernel §question():
        - Skill name (kebab-case)
        - Skill file path (relative to project root)
      3. Confirm deletion scope — verify skill exists before proceeding:
        - Read skill file at confirmed path
        - Check registry for any references
        - Mark skill_confirmed: true/false in output
      4. Write output (main agent collects):
        - skill_name: <name>
        - skill_path: <path>
        - skill_confirmed: true/false

  # impact-gate deleted (route-first: no forward routing) — impact-analysis now
  # runs unconditionally and self-judges on skill_confirmed (case 5).
  - id: impact-analysis
    type: main
    dependsOn: [skill-select]
    channels:
      - node:skill-select
    task: |
      Case-5 self-judgment: if skill-select output does not show
      skill_confirmed: true (skill not found or not confirmed), this node has
      NO WORK — output an empty impact declaration (no impact analysis) and
      finish; this is normal execution, not a skip.

      Otherwise analyze impact scope of deleting the confirmed skill.

      Read skill-select output (injected via dependsOn implicit context).

      Execute impact analysis:

      1. Reference graph analysis:
        - Search all .taskflow.yaml files in graphs/ for references to this skill name
        - Check skill field in main phases
        - Check channels entries referencing the skill
      2. Registry analysis:
        - Check registry.json for any entry pointing to this skill file
      3. Dependency graph analysis:
        - Search all other skills for skill references to this skill
        - Check if any skill depends on this one
      Write output (main agent collects):
        - affected_graphs: [list of graph names]
        - affected_skills: [list of skill names]
        - registry_entries: [list of registry keys]
        - impact_severity: low | medium | high
        - impact_summary: <description>

  - id: delete-confirm
    type: main
    dependsOn: [impact-analysis]
    channels:
      - node:skill-select
    task: |
      Case-5 self-judgment: if skill-select output does not show
      skill_confirmed: true (impact-analysis produced no impact analysis), this
      node has NO WORK — output delete_confirmed: false and finish; this is
      normal execution, not a skip.

      Otherwise confirm delete decision with impact report and irreversible warning.

      Read impact-analysis output (injected via dependsOn implicit context).
      Read skill-select upstream output file.
      Present via question() per atom-kernel §question():

      1. Display impact report — affected graphs, skills, registry entries
      2. Display warning: "Deletion is IRREVERSIBLE. No undo command available."
      3. Ask user to confirm: "Proceed with deletion?" with options:
        - Proceed — continue to execution
        - Abort — stop the graph
      4. If user confirms, proceed. If abort, mark delete_confirmed: false.
      5. Write output (main agent collects):
        - delete_confirmed: true/false
        - abort_reason: <string if aborted>

  # execute-gate deleted (route-first: no forward routing) — skill-delete-execute
  # now runs unconditionally and self-judges on delete_confirmed (case 5).
  - id: skill-delete-execute
    type: main
    dependsOn: [delete-confirm]
    channels:
      - node:skill-select
      - node:delete-confirm
    task: |
      Case-5 self-judgment: if delete-confirm output does not show
      delete_confirmed: true (user aborted), this node has NO WORK — output
      empty (no deletion performed) and finish; this is normal execution, not a
      skip.

      Otherwise execute skill deletion — file removal + registry update.

      Read delete-confirm output (injected via dependsOn implicit context).
      Read skill-select output (injected via dependsOn implicit context).

      Execute 3-step deletion per interview() solve mode:

      confirm(goal): Confirm deletion scope with user one last time. Verify skill path and name are correct.

      research: Identify all files and registry entries to modify:
        - Skill SKILL.md file path from skill-select output
        - Any associated files (e.g., examples, tests)
        - registry.json entry if present
        - Check no other skill depends on this one (re-verify impact)

      execute:
        1. Remove skill file at confirmed path
        2. If registry.json has entry for this skill, remove it and rewrite registry.json
        3. Verify post-deletion state:
          - Skill file no longer exists at path
          - Registry entry removed (if was present)
          - No broken skill references remain

      Write output (main agent collects):
        - deleted_files: [list of removed paths]
        - registry_updated: true/false
        - post_verification: pass | fail | warn
        - verification_details: <summary>

  - id: delete-review
    type: main
    dependsOn: [skill-delete-execute]
    skill: code-review
    agent: [reviewer, task]
    task: |
      Review delete result per code-review (use ## Agent hints for axis sub-agents).

      Artifact: delete execution results from skill-delete-execute output (injected).
      Standards: atom-graph-spec (injected) — verify registry.json integrity, no broken references.
      Spec: skill-select output (injected) — check deletion matches confirmed scope (correct skill, correct files).

      Output machine-parseable YAML with overall: pass | fail. Write report (main agent collects).
    channels:
      - node:skill-select
      - skill:atom-graph-spec

  # Gate — bounded auto-rework on FAIL (agent judgment, backward jump)
  - id: delete-gate
    type: gate
    dependsOn: [delete-review]
    jumps:
      - when: 'delete-review output shows overall: fail AND skill-delete-execute retryCount < 2'
        to: skill-delete-execute

  - id: delete-accept
    type: approval
    dependsOn: [delete-gate]
    channels:
      - node:delete-review
    task: |
      Accept the deletion?

      Deletion executed and reviewed (code-review output). Recommendation
      follows the review verdict (overall: pass | fail); free input overrides.
      Dynamic options include revise (re-run skill-delete-execute with review
      feedback) and revise impact analysis (jump back to impact-analysis).
