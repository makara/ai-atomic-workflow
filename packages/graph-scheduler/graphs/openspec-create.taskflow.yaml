name: openspec-create
phases:
  - id: spec-scope
    type: main
    dependsOn: []
    skill: atom-scope-interview
    channels:
      - ./CONTEXT.md
      - docs/adr/*.md
    task: |
      Execute scope interview per atom-scope-interview. Detect input source type:
        - wayfinder-map: read map, extract closed decisions
        - arch-review: read review report, extract findings
        - grill-consensus: read composed grill-with-docs output — extract decisions + doc_updates + adr_created
        - direct: interview for spec scope — follow grilling discipline (one-question-at-a-time,
          recommendation-first, decision-tree traversal)

      ADR judgment — inline conversation side effect (decisions crystallize in dialogue;
      judgment is never a separate autonomous step):
      - Sharpened inputs (wayfinder-map / arch-review / grill-consensus): decisions already
        crystallized upstream — adr_created ECHOES the upstream judgment (grill-consensus
        adr_created / review report decision), no re-derivation. Check docs/adr/ for an
        existing ADR covering the change's decisions and record it in adr_path (reuse —
        informational only, NEVER flips adr_created).
      - Direct input: at decision-crystallization moments apply the three-condition test
        (hard-to-reverse / surprising-without-context / real-trade-off); PROPOSE the ADR to
        the user — write to docs/adr/ only after explicit user confirmation; a declined ADR
        is recorded in the output without writing the file. Update CONTEXT.md terms as they
        crystallize.
      - adr_created MUST always be present in output — a missing judgment is an incomplete scope.

      Topics: spec domain + change type + input artifacts + destination (change name).

      Output: scope_complete, input_source, change_name, affected_domains, spec_plan,
      adr_created, adr_path?, decision_summary, decisions.

  # Spec gate — bounded auto-rework: re-run the scope interview while the scope is
  # incomplete or the ADR judgment is missing. Bound = spec-scope retryCount < 2
  # (JUMP counter, never zeroed — route-first redesign). No match → pass through to
  # spec-generate (degrades observably, e.g. spec_status: blocked).
  - id: spec-gate
    type: gate
    dependsOn: [spec-scope]
    jumps:
      - when: 'spec-scope output shows (scope_complete: false or missing OR adr_created: missing) AND spec-scope retryCount < 2'
        to: spec-scope

  - id: spec-generate
    type: main
    dependsOn: [spec-gate]
    skill: openspec-propose
    channels:
      - node:spec-scope
    task: |
      Generate delta spec change per openspec-propose.

      Change name: from spec-scope output; if absent -> {args.changeName}; else openspec list --json single active; else spec_status: blocked + candidates.

      Echo adr_created from spec-scope output (injected via node:spec-scope channel) — the
      downstream pipeline track gate selects the implementation track from this field.

      Output contract: change_name, domains, file_paths, validation_result, spec_status,
      adr_created (echo).
