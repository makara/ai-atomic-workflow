name: openspec-create
phases:
  - id: spec-scope
    type: main
    dependsOn: []
    skill: atom-scope-interview
    channels:
      - ./CONTEXT.md
    task: |
      Execute scope interview per skill://atom-scope-interview (load atom-kernel). Detect input source type:
        - wayfinder-map: read map, extract closed decisions
        - arch-review: read review report, extract findings
        - direct: interview for spec scope

      Topics: spec domain + change type + input artifacts + destination (change name).

      Output: scope_complete, input_source, change_name, affected_domains, spec_plan.

  - id: spec-accept-scope
    type: approval
    dependsOn: [spec-scope]
    eval:
      - when: 'spec-scope output shows scope_complete: false or missing AND retryAttempt < 2'
        action: retry
        target: spec-scope
        note: 'auto: spec scope incomplete'
    routing:
      actions:
        - action: continue
          label: Generate spec
          description: 'Scope confirmed — delegate to openspec propose CLI'
        - action: retry
          target: spec-scope
          label: Revise scope
          description: 'Scope needs changes — re-run spec-scope solve() loop'

  - id: arch-decision
    type: main
    dependsOn: [spec-accept-scope]
    skill: domain-modeling
    channels:
      - node:spec-scope
      - ./CONTEXT.md
      - docs/adr/*.md
    task: |
      Record architecture decision per domain-modeling.
      Artifact: spec-scope output (injected). Standards: ADR-FORMAT / CONTEXT-FORMAT.
      Apply three-condition test (hard-to-reverse / surprising-without-context / real-trade-off).
      Autonomous — never question().
      Output contract: adr_created, adr_path, decision_summary, test_result.

  - id: spec-generate
    type: main
    dependsOn: [arch-decision]
    skill: openspec-propose
    channels:
      - node:spec-scope
    task: |
      Generate delta spec change per openspec-propose.

      Change name: from spec-scope output; if absent -> {args.changeName}; else openspec list --json single active; else spec_status: blocked + candidates.

      Output contract: change_name, domains, file_paths, validation_result, spec_status.
