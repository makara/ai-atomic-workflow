name: grill-with-docs
phases:
  # Stage 1: Scope — confirm the raw idea and doc-trace intent
  - id: grill-scope
    type: main
    dependsOn: []
    skill: atom-scope-interview
    channels:
      - ./CONTEXT.md
    task: |
      Execute scope interview per atom-scope-interview.

      Topics: idea/goal (raw, unfogged), doc-trace intent (glossary terms + ADR offers expected),
      interview output record path.

      Output: scope_complete, idea_goal, doc_trace_intent, output_path.

  # Stage 2: Grilling — decision-tree conversation with inline domain-modeling side effects
  - id: grilling
    type: main
    dependsOn: [grill-scope]
    skill: grilling
    channels:
      - ./CONTEXT.md
      - docs/adr/*.md
      - skill:domain-modeling
    task: |
      Execute grilling graph mode per grilling skill — question() one question per turn,
      recommendation first, fact lookup before asking, walk every decision-tree branch.

      Mandatory interview — graph-dispatched grilling SHALL conduct a real conversation:
      at least one question() (idea/goal + scope confirmation) per execution. Zero-question
      degradation does NOT apply to graph dispatch — complete context is never a reason to
      skip asking; scope_complete/consensus requires user participation.

      Inline domain-modeling side effects (user-confirmed, never autonomous):
      - CONTEXT.md term updates at crystallization moments
      - ADR offers at decision-crystallization moments — three-condition test
        (hard-to-reverse / surprising-without-context / real-trade-off); write to
        docs/adr/ only after explicit user confirmation; declined ADRs recorded
        without writing

      Output (main agent collects):
        - consensus: { decisions: [{ decision, rationale }] }
        - doc_updates: [<CONTEXT.md term updates applied>]
        - adr_created: true | false
        - adr_path: <path when created>

  # Stage 3: Accept — decision confirmation (route-first, no written actions):
  # recommendation follows the grilling consensus; free input overrides. Dynamic
  # options include re-grill (re-run grilling with prior context) and restart
  # (re-run from the scope interview).
  - id: grill-accept
    type: approval
    dependsOn: [grilling]
    task: |
      Grilling consensus accepted?

      Grilling consensus reached. Continue → proceed to openspec-create.
      Recommendation follows the grilling consensus; free input overrides;
      dynamic options include re-grill (re-run grilling with prior context)
      and restart (re-run from scope confirmation).
