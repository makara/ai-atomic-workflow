name: release-prep
description: 'Pre-release preparation — deterministic version proposal from git tag history, grilling confirmation of every operation, apply + review as an inline flow loop.'
$schema: ../schemas/workflow.schema.json
version: 1.0.0
flow:
  - 'propose --> plan-grill'
  - 'plan-grill --> apply'
  - 'apply --> release-review'
  - 'release-review -->|fail| apply'
  - 'release-review -->|pass| __handoff'
inventory:
  - id: propose
    type: main
    goal: Executes release-prep-analyze to propose the version and changelog inventory
    constraints:
      - version derives from git tag history — never package.json
      - never executes git tag/commit/push — deterministic + idempotent pre-tag
  - id: plan-grill
    type: main
    goal: Runs grilling to confirm every planned release operation
    constraints:
      - never auto-gated — every operation confirmed before any write
  - id: apply
    type: main
    goal: Executes release-prep-apply to bump versions and fold the changelog
    constraints:
      - git boundary per propose rule
  - id: release-review
    type: main
    goal: Confirms release readiness THEN reports the round condition (pass | fail — fail routes the flow self-edge re-entry; verify-fail re-runs apply)
    constraints:
      - user executes tag/commit manually from the final report
constraints:
  - "loop bound: the flow self-edge re-entry (release-review -->|fail| apply) is bounded by the round condition 'pass' (release-ready) or the user's direct end; retryCount tracks re-entries (never zeroed)"
  - 'round condition vocabulary: fail | pass — flow-defined, matched mechanically (zero machine validation axis; governance = graph-maintain flow audit + user maintenance)'
phases:
  - id: propose
    type: main
    dependsOn: []
    skill: release-prep-analyze
    operations: [read, run]
    task: |
      Execute pre-release analysis per release-prep-analyze.

      Proposal rule: version derives from git tag history, never package.json;
      deterministic + idempotent pre-tag. Git boundary per inventory constraint.

      Output contract: last_tag, diff_summary, bump, proposed_version,
      tag_proposal, changelog_inventory, basis, idempotent.

  - id: plan-grill
    type: main
    dependsOn: [propose]
    skill: grilling
    operations: []
    task: |
      Execute grilling per grilling skill. Graph dispatch encapsulation
      contract — per the single source (task-templates/contracts.ts
      GRILLING_ENCAPSULATION_CONTRACT); never re-encode the body here.

      Confirm EVERY planned operation before any write: version value (from
      propose output — adjustable), version bump surfaces (release-line: root
      + workspace packages + marketplace manifests; presentation excluded),
      changelog fold scope, README targets, release boundary (working tree
      only).

      Output contract: confirmed_plan, decisions, shared_understanding.

  - id: apply
    type: main
    dependsOn: [plan-grill]
    skill: release-prep-apply
    operations: [read, write, verify]
    channels:
      - node:plan-grill
    task: |
      Execute pre-release writes per release-prep-apply.

      Apply the confirmed plan (from plan-grill's confirmed_plan —
      node:plan-grill channel): overwrite versions on release-line
      surfaces, fold CHANGELOG [Unreleased] -> [v<confirmed>] per
      release-prep-apply's fold contract, sync README lists vs ground
      truth. Overwrite-style, idempotent. Git boundary per inventory
      constraint.

      Output contract: surfaces_updated, changelog_written, readmes_updated,
      verify.

  - id: release-review
    type: main
    dependsOn: [apply]
    operations: []
    channels:
      - node:apply
    task: |
      Release-ready? (inline interview — human confirms at this boundary;
      branch choice via IF/ELSE.)

      Recommendation follows the apply verification: IF all verify pass →
      continue — the round completes (the final report prints the
      tag/commit commands). IF any verify fails → report round_condition:
      fail — the flow self-edge re-enters apply (report the failing
      verifies). End the release round early — direct end (the final report
      still prints the tag/commit commands).
      direct end: end the round.

      Round condition: report round_condition (pass | fail) — the
      flow-defined round condition: 'fail' when any apply verify fails
      (the flow self-edge re-enters apply); 'pass' when all apply verifies
      pass (release-ready → drain); direct end → drain.

      Output contract: round_condition (pass | fail).
