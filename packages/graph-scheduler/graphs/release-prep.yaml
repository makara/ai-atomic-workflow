name: release-prep
$schema: ../schemas/workflow.schema.json
version: 1.0.0
# Node overview table (atom inventory). Bounded compound goals:
# connectors AND/THEN/IF-ELSE/OR — structural keywords ALL-CAPS (AND/OR/IF/
# THEN/ELSE), prose and/or lowercase, ≤ 5 steps, gates ≤ 3 AND/OR operands,
# conditional paths ≤ 3. Entry shape { id, type, goal, constraints? } — goal
# states the atom's intent; mechanism lives in the goal (flow entries state
# "expands <use> subgraph"). constraints: one-sentence prose rules — general
# boundaries + explicit non-goals, ≤ 5 per atom, never machine-validated.
# User-maintained.
inventory:
  - id: propose
    type: main
    goal: Executes release-prep-analyze to propose the version and changelog inventory
    constraints:
      - version derives from git tag history — never package.json
      - never executes git tag/commit/push — deterministic + idempotent pre-tag
  - id: plan-grill
    type: main
    goal: Runs grilling to confirm every planned release operation
    constraints:
      - never auto-gated — every operation confirmed before any write
  - id: apply
    type: main
    goal: Executes release-prep-apply to bump versions and fold the changelog
    constraints:
      - never executes git tag/commit/push — overwrite-style, idempotent
  - id: release-review
    type: approval
    goal: Accept the release prep OR route rework; continue completes the run
    constraints:
      - never executes tag/commit — the user runs them manually from the final report
phases:
  # Proposal — read-only analysis (version from git tags, never package.json;
  # deterministic + idempotent pre-tag; never git tag/commit/push).
  - id: propose
    type: main
    dependsOn: []
    skill: release-prep-analyze
    operations: [read, run]
    task: |
      Execute pre-release analysis per release-prep-analyze.

      Proposal rule: version derives from git tag history, never package.json;
      deterministic + idempotent pre-tag. NEVER execute git tag/commit/push.

      Output contract: last_tag, diff_summary, bump, proposed_version,
      tag_proposal, changelog_inventory, basis, idempotent.

  # Confirmation — grilling exploration (encapsulation contract — upstream
  # skill untouched; never auto-gated, never zero-question): every planned
  # operation confirmed before any write.
  - id: plan-grill
    type: main
    dependsOn: [propose]
    skill: grilling
    operations: []
    task: |
      Execute grilling per grilling skill. Graph dispatch encapsulation
      contract: MANDATORY question rounds — at least one round, whole
      frontier per round, never zero-question, never auto-gated (cards in
      any mode); output shape { decisions: [{ decision, rationale }],
      shared_understanding: boolean } — never 'consensus'.

      Confirm EVERY planned operation before any write: version value (from
      propose output — adjustable), version bump surfaces (release-line: root
      + workspace packages + marketplace manifests; presentation excluded),
      changelog fold scope, README targets, release boundary (working tree
      only — tag/commit user-executed).

      Output contract: confirmed_plan, decisions, shared_understanding.

  # Writes — confirmed plan in, verified release-ready working tree out.
  - id: apply
    type: main
    dependsOn: [plan-grill]
    skill: release-prep-apply
    operations: [read, write, verify]
    task: |
      Execute pre-release writes per release-prep-apply.

      Apply the confirmed plan (node:plan-grill): overwrite versions on
      release-line surfaces, fold CHANGELOG [Unreleased] -> [v<confirmed>]
      per release-prep-apply's fold contract, sync README lists vs ground
      truth. Overwrite-style, idempotent. NEVER execute git tag/commit/push.

      Output contract: surfaces_updated, changelog_written, readmes_updated,
      verify.

  # Final approval — continue completes the run (report prints the tag/commit
  # commands; user executes manually); jump re-runs a target phase.
  - id: release-review
    type: approval
    dependsOn: [apply]
    channels:
      - node:plan-grill
    task: |
      Release-ready?

      Recommendation follows the apply verification: verify all pass →
      continue (run completes — final report prints the tag/commit commands,
      user executes them manually); any verify fail → jump to apply.
